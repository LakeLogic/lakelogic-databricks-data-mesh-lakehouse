# ── RideFlow Platform System Registry ────────────────────────────────────────
# Core ride-sharing + food delivery platform.
# Entities: riders, drivers, trips, restaurants (Phase 2).
domain: marketplace

system: rideflow

metadata:
  # UC mode: run/SLO logs are MANAGED UC Delta tables in the marketplace domain.
  # A Volume path (e.g. {log_root}/…) fails here — the deltalake writer needs
  # atomic renames the Volume FUSE layer forbids ("Operation not permitted").
  # A managed table ({catalog}.{domain}.<table>) is created via Spark and works.
  # backend: spark → written via Spark saveAsTable = a MANAGED UC Delta table.
  # (backend: delta uses the path-based deltalake writer, which needs atomic
  # renames a UC Volume forbids — that is what failed here.)
  run_log_table: "{domain_catalog}._lakelogic_run_log"
  run_log_backend: "spark"
  slo_checks_table: "{domain_catalog}._lakelogic_slo_checks"
  slo_checks_backend: "spark"

quarantine:
  enabled: true
  fail_on_quarantine: false
  include_error_reason: true
  format: "delta"
  mode: "append"

storage:
  # ── Table Resolution: a CATALOG PER DOMAIN, a schema per layer ────────────
  #   `{domain_catalog_prefix}_{domain}`.files       volumes: `landing` for inbound files; others (outbound, reference) as needed
  #                       .bronze / .silver / .gold
  #                       .quarantine  rows a contract rejected
  #                       .lakelogic   run log, SLO checks, erasure requests
  # One grant covers a layer (analysts: gold; ingestion: the landing volume), and the domain
  # team owns the catalog. Table names keep their layer prefix, so a table has the
  # same name wherever it is addressed from.
  bronze_root: "`{domain_catalog_prefix}_{domain}`.{bronze_layer}"
  silver_root: "`{domain_catalog_prefix}_{domain}`.{silver_layer}"
  gold_root: "`{domain_catalog_prefix}_{domain}`.{gold_layer}"
  # The engine's own tables ({domain_catalog}._lakelogic_run_log ...).
  domain_catalog: "`{domain_catalog_prefix}_{domain}`.lakelogic"
  quarantine_root: "`{domain_catalog_prefix}_{domain}`.quarantine"
  quarantine_table_name: "quarantine_{table}"

  # ── Operational Paths (UC mode — Databricks Volumes) ──────────────────────
  contract_root: "/Workspace/Shared/data_platform/contracts/{domain}/{system}"
  landing_root: "/Volumes/{domain_catalog_prefix}_{domain}/files/landing/{system}"
  log_root: "/Volumes/{catalog}/nondelta/_logs"

  # ── Storage Paths (direct mode — cloud/local) ────────────────────────────
  # Resolve relative to data_root so local envs land on disk; cloud envs land on abfss.

# ── External Sources (for lineage visualization) ────────────────────────────
external_sources:
  - name: "RideFlow Platform API"
    type: api
    source_domain: "Internal Platform"
    catalog_path: "rideflow_backend_api"
    consumed_by:
      - "bronze_rideflow_rider_profiles"
      - "bronze_rideflow_rider_app_events"
      - "bronze_rideflow_driver_profiles"
      - "bronze_rideflow_driver_telemetry"
      - "bronze_rideflow_trip_requests"
      - "bronze_rideflow_trip_completed"
      - "bronze_rideflow_trip_cancellations"

# ── Contract Registry ───────────────────────────────────────────────────────
contracts:
  # Bronze Layer
  - layer: bronze
    entity: bronze_rideflow_rider_profiles
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_rider_profiles.yaml"
    enabled: true
  - layer: bronze
    entity: bronze_rideflow_rider_app_events
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_rider_app_events.yaml"
    enabled: true
  - layer: bronze
    entity: bronze_rideflow_driver_profiles
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_driver_profiles.yaml"
    enabled: true
  - layer: bronze
    entity: bronze_rideflow_driver_telemetry
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_driver_telemetry.yaml"
    enabled: true
  - layer: bronze
    entity: bronze_rideflow_trip_requests
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_trip_requests.yaml"
    enabled: true
  - layer: bronze
    entity: bronze_rideflow_trip_completed
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_trip_completed.yaml"
    enabled: true
  - layer: bronze
    entity: bronze_rideflow_trip_cancellations
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_trip_cancellations.yaml"
    enabled: true

  # Silver Layer
  - layer: silver
    entity: silver_rideflow_driver_profiles
    path: "contracts/{silver_layer}/silver_rideflow_driver_profiles.yaml"
    enabled: true
  - layer: silver
    entity: silver_rideflow_driver_telemetry
    path: "contracts/{silver_layer}/silver_rideflow_driver_telemetry.yaml"
    depends_on: ['silver_rideflow_driver_profiles']
    enabled: true
  - layer: silver
    entity: silver_rideflow_rider_profiles
    path: "contracts/{silver_layer}/silver_rideflow_rider_profiles.yaml"
    enabled: true
  - layer: silver
    entity: silver_rideflow_rider_app_events
    path: "contracts/{silver_layer}/silver_rideflow_rider_app_events.yaml"
    # Contract existed but was never registered; gold app-events fact + event/platform dims read it.
    depends_on: ['bronze_rideflow_rider_app_events']
    enabled: true
  - layer: silver
    entity: silver_rideflow_trips
    path: "contracts/{silver_layer}/silver_rideflow_trips.yaml"
    depends_on: ['bronze_rideflow_trip_completed', 'silver_rideflow_rider_profiles', 'silver_rideflow_driver_profiles']
    enabled: true
  - layer: silver
    entity: silver_rideflow_trip_requests
    path: "contracts/{silver_layer}/silver_rideflow_trip_requests.yaml"
    depends_on: ['bronze_rideflow_trip_requests']
    enabled: true
  - layer: silver
    entity: silver_rideflow_trip_cancellations
    path: "contracts/{silver_layer}/silver_rideflow_trip_cancellations.yaml"
    depends_on: ['bronze_rideflow_trip_cancellations']
    enabled: true

  # Gold Layer
  # Generated by the LakeLogic Build Centre (Medallion Builder). Kimball star: SCD2 driver/rider
  # dims, SCD1 code dims, facts resolving *_sk as-of against the SCD2 dims. The BC model read a
  # silver `silver_rideflow_trip_completed`; here that entity is `silver_rideflow_trips` (same
  # columns, also read by shared/ and operations/), so the gold contracts are repointed to it.
  # City and payment-method dims are NOT built here - conform to reference.gold_dim_city and
  # reference.gold_dim_payment_method (join on city_code / payment_method_code).
  - layer: gold
    entity: gold_dim_cancel_reason_code
    path: "contracts/{gold_layer}/gold_dim_cancel_reason_code.yaml"
    depends_on: ['silver_rideflow_trip_cancellations']
    enabled: true
  - layer: gold
    entity: gold_dim_cancelled_by
    path: "contracts/{gold_layer}/gold_dim_cancelled_by.yaml"
    depends_on: ['silver_rideflow_trip_cancellations']
    enabled: true
  - layer: gold
    entity: gold_dim_driver
    path: "contracts/{gold_layer}/gold_dim_driver.yaml"
    depends_on: ['silver_rideflow_driver_profiles']
    enabled: true
  - layer: gold
    entity: gold_dim_driver_telemetry_status
    path: "contracts/{gold_layer}/gold_dim_driver_telemetry_status.yaml"
    depends_on: ['silver_rideflow_driver_telemetry']
    enabled: true
  - layer: gold
    entity: gold_dim_event_name
    path: "contracts/{gold_layer}/gold_dim_event_name.yaml"
    depends_on: ['silver_rideflow_rider_app_events']
    enabled: true
  - layer: gold
    entity: gold_dim_platform
    path: "contracts/{gold_layer}/gold_dim_platform.yaml"
    depends_on: ['silver_rideflow_rider_app_events']
    enabled: true
  - layer: gold
    entity: gold_dim_preferred_payment_method
    path: "contracts/{gold_layer}/gold_dim_preferred_payment_method.yaml"
    depends_on: ['silver_rideflow_rider_profiles']
    enabled: true
  - layer: gold
    entity: gold_dim_rider
    path: "contracts/{gold_layer}/gold_dim_rider.yaml"
    depends_on: ['silver_rideflow_rider_profiles']
    enabled: true
  - layer: gold
    entity: gold_dim_rider_profiles_status
    path: "contracts/{gold_layer}/gold_dim_rider_profiles_status.yaml"
    depends_on: ['silver_rideflow_rider_profiles']
    enabled: true
  - layer: gold
    entity: gold_dim_trip_type
    path: "contracts/{gold_layer}/gold_dim_trip_type.yaml"
    depends_on: ['silver_rideflow_trips', 'silver_rideflow_trip_requests']
    enabled: true
  - layer: gold
    entity: gold_fact_driver_telemetry
    path: "contracts/{gold_layer}/gold_fact_driver_telemetry.yaml"
    depends_on: ['silver_rideflow_driver_telemetry', 'gold_dim_driver']
    enabled: true
  - layer: gold
    entity: gold_fact_rider_app_events
    path: "contracts/{gold_layer}/gold_fact_rider_app_events.yaml"
    depends_on: ['silver_rideflow_rider_app_events', 'gold_dim_rider']
    enabled: true
  - layer: gold
    entity: gold_fact_trip_cancellations
    path: "contracts/{gold_layer}/gold_fact_trip_cancellations.yaml"
    depends_on: ['silver_rideflow_trip_cancellations', 'gold_dim_driver', 'gold_dim_rider']
    enabled: true
  - layer: gold
    entity: gold_fact_trip_completed
    path: "contracts/{gold_layer}/gold_fact_trip_completed.yaml"
    depends_on: ['silver_rideflow_trips', 'gold_dim_driver', 'gold_dim_rider']
    enabled: true
  - layer: gold
    entity: gold_fact_trip_requests
    path: "contracts/{gold_layer}/gold_fact_trip_requests.yaml"
    depends_on: ['silver_rideflow_trip_requests', 'gold_dim_rider']
    enabled: true

  # Hand-authored gold (not Build Centre): the driver scorecard and the two daily aggregates.
  # The conformed SCD2 rider/driver dims (gold_dim_rider, gold_dim_driver) are listed above,
  # where every fact that keys to them can see them: there is ONE driver and ONE rider dimension.
  # Same table names as the Fabric demo.
  - layer: gold
    entity: gold_dim_driver_scorecard
    path: "contracts/{gold_layer}/gold_dim_driver_scorecard.yaml"
    depends_on: ['silver_rideflow_trips', 'gold_dim_driver']
    enabled: true
  - layer: gold
    entity: gold_fact_rider_daily_metrics
    path: "contracts/{gold_layer}/gold_fact_rider_daily_metrics.yaml"
    depends_on: ['silver_rideflow_trips', 'gold_dim_rider']
    enabled: true
  - layer: gold
    entity: gold_fact_trip_daily_kpis
    path: "contracts/{gold_layer}/gold_fact_trip_daily_kpis.yaml"
    depends_on: ['silver_rideflow_trips']
    enabled: true

# ── Lineage (inherited by all contracts) ────────────────────────────────────
lineage:
  enabled: true
  source_column_name: "_lakelogic_source"
  timestamp_column_name: "_lakelogic_processed_at"
  run_id_column_name: "_lakelogic_run_id"
  contract_name_column_name: "_lakelogic_contract_name"
  capture_domain: false
  capture_system: false

# ── Materialization (per-layer defaults, contracts override) ────────────────
materialization:
  # Every layer partitions by country: the simulator stamps country_code on every entity
  # from its city, and one country follows a record through every relationship (a GB
  # rider's trip is driven by a GB driver), so each country lands in its own folder
  # (country_code=GB/) from bronze to gold. Tables without the column (e.g. per-rider
  # aggregates) are written unpartitioned, with a warning. A table that already exists
  # keeps its layout until it is rebuilt — Delta cannot repartition in place.
  _all:
    partition_by: [country_code]
  bronze:
    strategy: append
    format: delta
  silver:
    strategy: merge
    format: delta
    merge_dedup_guard: true
  gold:
    strategy: merge
    format: delta

# ── Server Defaults (per-layer, contracts override) ─────────────────────────
server:
  bronze:
    cast_to_string: true
    schema_policy:
      evolution: append
      unknown_fields: allow
    post_ingestion:
      action: retain                   # delete | archive | retain
      cleanup_is_blocking: false        # if true, cleanup failure fails the pipeline; false = warn only
      retry_orphaned_files: true        # retry cleanup of previously failed files on next run
  silver:
    schema_policy:
      evolution: strict
      # `drop` projects bronze rows to silver's declared model — extra columns
      # are silently discarded rather than quarantining the whole row. `strict`
      # still prevents the silver CONTRACT from gaining unintended new fields;
      # this knob just lets upstream stay slightly wider without blocking us.
      unknown_fields: drop
  gold:
    schema_policy:
      # strict is fine as of lakelogic 1.36.0: the schema-enforcement escape hatch
      # now recognises SCD2 materialization + post-phase rollup/derive, so the
      # materializer-injected columns (surrogate key, effective_from/to, is_current,
      # version) and aggregate outputs no longer quarantine every row.
      evolution: strict
      unknown_fields: drop

# ── Cost Observability ──────────────────────────────────────────────────────
cost:
  provider: "manual"
  attribution: "duration_proportional"
  currency: "GBP"
  rates:
    dbu_per_hour: 0.22
    storage_per_gb_month: 0.023
  cluster:
    min_nodes: 2
    max_nodes: 8
    scaling_assumption: "avg"
  layer_rates:
    bronze:
      dbu_per_hour: 0.15
      cluster:
        min_nodes: 1
        max_nodes: 4
        scaling_assumption: "min"
    silver:
      dbu_per_hour: 0.22
    gold:
      dbu_per_hour: 0.55
      cluster:
        min_nodes: 1
        max_nodes: 16
        scaling_assumption: "p75"

notifications_enabled: false

# ══════════════════════════════════════════════════════════════════════════════
# ENVIRONMENTS
# ══════════════════════════════════════════════════════════════════════════════

x-azure-storage: &azure_storage
  storage_root: "abfss://nondelta@{storage_account}.dfs.core.windows.net"
  data_root: "abfss://{domain}@{storage_account}.dfs.core.windows.net"

environments:
  dev:
    domain_catalog_prefix: "rideflow_dev"
    catalog: "${RIDEFLOW_DEV_CATALOG}"
    storage_account: "${RIDEFLOW_DEV_STORAGE_ACCOUNT}"
    <<: *azure_storage
  staging:
    domain_catalog_prefix: "rideflow_stg"
    catalog: "${RIDEFLOW_STG_CATALOG}"
    storage_account: "${RIDEFLOW_STG_STORAGE_ACCOUNT}"
    <<: *azure_storage
  prod:
    domain_catalog_prefix: "rideflow_prod"
    catalog: "${RIDEFLOW_PROD_CATALOG}"
    storage_account: "${RIDEFLOW_PROD_STORAGE_ACCOUNT}"
    <<: *azure_storage
  local:
    domain_catalog_prefix: "rideflow_local"
    catalog: "local"
    storage_root: "./lakehouse"
    data_root: "./lakehouse/{domain}"
  local_polars:
    domain_catalog_prefix: "rideflow_local_polars"
    catalog: "local"
    storage_root: "./lakehouse_polars"
    data_root: "./lakehouse_polars/{domain}"
  local_duckdb:
    domain_catalog_prefix: "rideflow_local_duckdb"
    catalog: "local"
    storage_root: "./lakehouse_duckdb"
    data_root: "./lakehouse_duckdb/{domain}"
  local_spark:
    domain_catalog_prefix: "rideflow_local_spark"
    catalog: "local"
    storage_root: "./lakehouse_spark"
    data_root: "./lakehouse_spark/{domain}"
  colab:
    domain_catalog_prefix: "rideflow_colab"
    catalog: "colab"
    storage_root: "/content/lake"
    data_root: "/content/lake/{domain}"
