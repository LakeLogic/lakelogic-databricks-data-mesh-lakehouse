version: 1.0.0

info:
  data_product: rider_and_driver_profiles
  data_product_output: dim_rider
  title: "Gold — Dim Rider (SCD2)"
  table_name: "{gold_layer}_dim_rider"
  description: >
    Slowly Changing Dimension (Type 2) for marketplace riders. Tracks
    history when an attribute that affects analytics changes — status,
    home city, preferred payment method. Point-in-time (as-of) lookup of rider_sk for
    gold_fact_rider_daily_metrics.
  target_layer: gold
  domain: marketplace
  system: rideflow

model:
  fields:
    # ── Surrogate + business keys ────────────────────────────────────────
    - name: rider_sk
      type: string
      # string, not long: surrogate_key_strategy=hash emits a sha2 hex string.
      # NOT required: injected by the SCD2 materializer, so it is absent from the
      # source. Marking it required would quarantine every source row at schema
      # validation (which runs before materialization) → 0 versions written.
      description: "Surrogate key (sha2 hash); new for each SCD2 version"
    - name: rider_id
      type: string
      required: true
      description: "Business key — stable across versions"
    # ── Tracked / informational attributes ───────────────────────────────
    - name: name
      type: string
      pii: true
    - name: email
      type: string
      pii: true
    - name: phone
      type: string
      pii: true
    - name: home_address
      type: string
      pii: true
      description: "SCD2-tracked — rider may move"
    - name: city_code
      type: string
      description: "SCD2-tracked — primary operating city"
    - name: country_code
      type: string
      description: "ISO 3166-1 alpha-2 country of city_code — the partition key (materialization._all in _system.yaml)"
    - name: status
      type: string
      description: "SCD2-tracked: active | inactive | suspended"
    - name: preferred_payment_method
      type: string
      description: "SCD2-tracked — payment method preference change"
    - name: signup_date
      type: date
    - name: updated_at
      type: timestamp
      description: "silver_rideflow_rider_profiles.updated_at — drives version cuts"
    # ── SCD2 mechanics ───────────────────────────────────────────────────
    - name: effective_from
      type: timestamp
      # NOT required: injected by the SCD2 materializer (see rider_sk note).
    - name: effective_to
      type: timestamp
      description: "Closed when superseded; NULL for current version"
    - name: is_current
      type: boolean
      # NOT required: injected by the SCD2 materializer (see rider_sk note).
    - name: version_number
      type: long
      description: "1, 2, 3... per rider_id (SCD2 materializer emits bigint)"
    - name: system
      type: string
      required: true
      description: Source system this row came from

# SCD2 matches existing↔incoming on the BUSINESS key, so primary_key must be
# rider_id (stable across versions) — NOT the surrogate rider_sk (generated per
# version by the materializer). Composite (rider_id, effective_from) uniqueness
# is documented via natural_key.
primary_key: [rider_id]
natural_key: [rider_id, effective_from]

source:
  type: table
  path: "table:{domain_catalog}.silver_rideflow_rider_profiles"
  # Incremental like the other gold dims: silver is merged on its key, so re-read rows
  # re-enter the SCD2 compare and cut a version only when a tracked column changed.
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

# Gold schema_policy is `strict` (lakelogic >= 1.36.0 recognises the SCD2-injected
# columns), so the surrogate key + effective_from/to + is_current + version_number
# are declared here but NOT required — they are absent from the source.

# SCD2 reads silver_rideflow_rider_profiles directly and cuts new versions on
# `updated_at`. The SCD2 mechanics columns (rider_sk, effective_from/to,
# is_current, version_number) are injected by the materializer below — they are
# NOT expected to exist in the source. (An earlier pre-phase SELECT that renamed
# updated_at -> source_updated_at was removed: the engine pruned the source read
# to the projected columns *before* the pre-SQL ran, so `updated_at` resolved
# against a narrowed relation and failed. Reading it directly avoids that.)

# Native LakeLogic SCD2. NOTE: the old top-level `scd:` block was NOT read by
# the engine (it logged "Unknown key 'scd'") — SCD2 config MUST live here under
# materialization.scd2.
materialization:
  strategy: scd2
  format: delta
  scd2:
    surrogate_key: rider_sk
    surrogate_key_strategy: hash
    timestamp_field: updated_at
    effective_from_field: effective_from
    effective_to_field: effective_to
    current_flag_field: is_current
    version_column: version_number
    # Disable _change_reason: engine adds it only on the MERGE path, not initial
    # load → re-run schema mismatch (DELTA_METADATA_MISMATCH) under UC Table ACLs.
    change_reason_column: ""
    track_columns:
      - city_code
      - home_address
      - status
      - preferred_payment_method
    unknown_member:
      enabled: true
      surrogate_key_value: "-1"

quality:
  row_rules: []
  dataset_rules:
    - unique: rider_sk

# Every gold row names the source system it came from (single-system table).
transformations:
  - phase: pre
    derive:
      field: system
      sql: "'rideflow'"

downstream:
  - type: semantic_model
    name: "sm_rideflow_gold"
    platform: powerbi
    managed: false
