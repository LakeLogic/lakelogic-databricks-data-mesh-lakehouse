# ── Reference Data System Registry ───────────────────────────────────────────
# Static reference data: cities, vehicle types, surge tiers, cancellation reasons.
# Also includes Python-generated dimensions (dim_date).
domain: reference

system: internal

metadata:
  run_log_table: "{domain_catalog}._lakelogic_run_log"
  run_log_backend: "spark"
  slo_checks_table: "{domain_catalog}._lakelogic_slo_checks"
  slo_checks_backend: "spark"

storage:
  # A CATALOG PER DOMAIN, a schema per layer: `rideflow_dev_{domain}`.bronze / .silver / .gold,
  # .quarantine for rejected rows, .lakelogic for the run log, .files for volumes.
  bronze_root: "`{domain_catalog_prefix}_{domain}`.{bronze_layer}"
  silver_root: "`{domain_catalog_prefix}_{domain}`.{silver_layer}"
  gold_root: "`{domain_catalog_prefix}_{domain}`.{gold_layer}"
  domain_catalog: "`{domain_catalog_prefix}_{domain}`.lakelogic"
  quarantine_root: "`{domain_catalog_prefix}_{domain}`.quarantine"
  quarantine_table_name: "quarantine_{table}"
  contract_root: "/Workspace/Shared/data_platform/contracts/{domain}/{system}"
  # UC-mode operational paths (were missing → {landing_root} stayed a literal
  # 'dbfs:/{landing_root}/...' and every bronze read failed PATH_NOT_FOUND).
  landing_root: "/Volumes/{domain_catalog_prefix}_{domain}/files/landing/{system}"
  log_root: "/Volumes/{catalog}/nondelta/_logs"

contracts:
  # ── Bronze: raw external feeds ────────────────────────────────────────────
  - layer: bronze
    entity: bronze_internal_city_master
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_city_master.yaml"
    enabled: true
  - layer: bronze
    entity: bronze_internal_fx_rates_daily
    path: "contracts/{bronze_layer}/{bronze_layer}_{system}_fx_rates_daily.yaml"
    enabled: true

  # ── Silver: cleaned + typed ───────────────────────────────────────────────
  - layer: silver
    entity: silver_internal_cities
    path: "contracts/{silver_layer}/silver_internal_cities.yaml"
    depends_on: ['bronze_internal_city_master']
    enabled: true
  - layer: silver
    entity: silver_internal_fx_rates_daily
    path: "contracts/{silver_layer}/silver_internal_fx_rates_daily.yaml"
    depends_on: ['bronze_internal_fx_rates_daily']
    enabled: true

  # ── Gold: dim_ (SCD2 capable) and fact_ ───────────────────────────────────
  - layer: gold
    entity: gold_dim_date
    path: "contracts/{gold_layer}/gold_dim_date.yaml"
    enabled: true
  - layer: gold
    entity: gold_dim_country
    path: "contracts/{gold_layer}/gold_dim_country.yaml"
    enabled: true
  - layer: gold
    entity: gold_dim_currency
    path: "contracts/{gold_layer}/gold_dim_currency.yaml"
    enabled: true
  - layer: gold
    entity: gold_dim_city
    path: "contracts/{gold_layer}/gold_dim_city.yaml"
    depends_on: ['silver_internal_cities']
    enabled: true
  - layer: gold
    entity: gold_fact_fx_rate_daily
    path: "contracts/{gold_layer}/gold_fact_fx_rate_daily.yaml"
    depends_on: ['silver_internal_fx_rates_daily']
    enabled: true
  - layer: gold
    entity: gold_dim_vehicle_type
    path: "contracts/{gold_layer}/gold_dim_vehicle_type.yaml"
    enabled: true
  - layer: gold
    entity: gold_dim_payment_method
    path: "contracts/{gold_layer}/gold_dim_payment_method.yaml"
    enabled: true
  - layer: gold
    entity: gold_dim_surge_tier
    path: "contracts/{gold_layer}/gold_dim_surge_tier.yaml"
    enabled: true
  - layer: gold
    entity: gold_dim_cancellation_reason
    path: "contracts/{gold_layer}/gold_dim_cancellation_reason.yaml"
    enabled: true

lineage:
  enabled: true

materialization:
  # bronze/silver were unset → defaulted to parquet, which UC managed tables
  # reject ("Only Delta is supported for managed tables"). Pin them to delta.
  bronze:
    strategy: append
    format: delta
  silver:
    # reference/lookup tables are full snapshots — overwrite, not merge
    # (merge would require a primary_key on every lookup contract)
    strategy: overwrite
    format: delta
  gold:
    strategy: overwrite
    format: delta

server:
  bronze:
    cast_to_string: true
    schema_policy:
      evolution: append
      unknown_fields: allow
  silver:
    schema_policy:
      # append (not strict): reference lookups declare derived columns (e.g.
      # cities.is_active) not present in the raw feed — strict would quarantine
      # every row for the "missing" field. The quarantine demo lives in
      # marketplace, not in clean reference data.
      evolution: append
      unknown_fields: quarantine
  gold:
    schema_policy:
      evolution: append
      unknown_fields: drop

notifications_enabled: false

x-azure-storage: &azure_storage
  storage_root: "abfss://nondelta@{storage_account}.dfs.core.windows.net"
  data_root: "abfss://reference@{storage_account}.dfs.core.windows.net"
  quarantine_root: "abfss://quarantine@{storage_account}.dfs.core.windows.net"

environments:
  dev:
    domain_catalog_prefix: "rideflow_dev"
    catalog: "${RIDEFLOW_DEV_CATALOG}"
    storage_account: "${RIDEFLOW_DEV_STORAGE_ACCOUNT}"
    <<: *azure_storage
  staging:
    domain_catalog_prefix: "rideflow_stg"
    catalog: "rideflow_stg_platform"
    storage_account: "${RIDEFLOW_STG_STORAGE_ACCOUNT}"
    <<: *azure_storage
  prod:
    domain_catalog_prefix: "rideflow_prod"
    catalog: "rideflow_prod_platform"
    storage_account: "${RIDEFLOW_PROD_STORAGE_ACCOUNT}"
    <<: *azure_storage
  local:
    domain_catalog_prefix: "rideflow_local"
    catalog: "local"
    storage_root: "./lakehouse"
    data_root: "./lakehouse/reference"
    quarantine_root: "./lakehouse/_quarantine"
  local_polars:
    domain_catalog_prefix: "rideflow_local_polars"
    catalog: "local"
    storage_root: "./lakehouse_polars"
    data_root: "./lakehouse_polars/reference"
    quarantine_root: "./lakehouse_polars/_quarantine"
  local_spark:
    domain_catalog_prefix: "rideflow_local_spark"
    catalog: "local"
    storage_root: "./lakehouse_spark"
    data_root: "./lakehouse_spark/{domain}"
    quarantine_root: "./lakehouse_spark/_quarantine"
  local_duckdb:
    domain_catalog_prefix: "rideflow_local_duckdb"
    catalog: "local"
    storage_root: "./lakehouse_duckdb"
    data_root: "./lakehouse_duckdb/{domain}"
    quarantine_root: "./lakehouse_duckdb/_quarantine"
  colab:
    domain_catalog_prefix: "rideflow_colab"
    catalog: "colab"
    storage_root: "/content/lake"
    data_root: "/content/lake/reference"
    quarantine_root: "/content/lake/_quarantine"
