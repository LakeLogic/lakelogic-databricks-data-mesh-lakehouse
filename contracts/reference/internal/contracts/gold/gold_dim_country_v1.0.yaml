version: 1.0.0

info:
  data_product: reference_data
  data_product_output: dim_country
  title: "Gold — Dim Country"
  table_name: "{gold_layer}_dim_country"
  description: >
    ISO 3166-1 country dimension. Loaded once from a static CSV seed; can be
    refreshed when ISO publishes a new revision.
  target_layer: gold
  domain: reference
  system: internal

model:
  fields:
    - name: country_alpha3
      type: string
      required: true
      description: "ISO 3166-1 alpha-3 (e.g. GBR, USA, IND)"
    - name: country_alpha2
      type: string
      description: "ISO 3166-1 alpha-2 (e.g. GB, US, IN)"
    - name: country_name
      type: string
    - name: country_numeric
      type: int
    - name: region
      type: string
      description: "UN M.49 region (Europe, Americas, Asia, ...)"
    - name: sub_region
      type: string
    - name: system
      type: string
      required: true
      description: Source system this row came from

quality:
  row_rules: []
  dataset_rules:
    - unique: country_alpha3

primary_key: [country_alpha3]

source:
  type: landing
  path: "{landing_root}/dim_country_seed"
  format: csv
  options:
    header: "true"
  load_mode: incremental
  watermark_strategy: pipeline_log

# Incremental source → upsert on primary_key (SCD1) so a re-read or
# updated row replaces its previous version instead of duplicating.
materialization:
  strategy: merge

# Every gold row names the source system it came from (single-system table).
transformations:
  - phase: pre
    derive:
      field: system
      sql: "'internal'"

downstream:
  - type: semantic_model
    name: "sm_rideflow_gold"
    platform: powerbi
    managed: false
  - type: semantic_model
    name: "sm_rideflow_marketing"
    platform: powerbi
    managed: false
