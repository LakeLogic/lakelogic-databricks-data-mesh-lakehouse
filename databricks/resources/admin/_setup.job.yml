# ══════════════════════════════════════════════════════════════════════════════
# RideFlow Demo — 🚀 One-Click Bootstrap
# ══════════════════════════════════════════════════════════════════════════════
# The single job a tester runs after `databricks bundle deploy`.
#   1. nb_00_setup  — creates the catalog, schemas, landing Volumes, stages contracts
#   2. runs the marketplace medallion end-to-end (test data → bronze → silver → gold)
#
# Everything runs on serverless compute against Unity Catalog — no cluster to
# configure, no Azure ADLS. Run the other domain orchestrators the same way to
# populate the full mesh.
resources:
  jobs:
    setup:
      name: "[${bundle.target}] pl_admin_setup"
      description: "Provision Unity Catalog (schemas, landing Volumes, contracts) then generate and process the marketplace medallion end-to-end."

      tags:
        group: admin
        managed_by: lakelogic
        layer: bootstrap

      tasks:
        # ── Step 1: Provision catalog / schemas / volumes / contracts ─────────
        - task_key: setup
          notebook_task:
            notebook_path: ../../notebooks/nb_00_setup.py
            base_parameters:
              lakelogic_wheel: "${var.lakelogic_wheel}"
              lakelogic_version: "${var.lakelogic_version}"
              catalog: "${var.catalog}"
              # Drop the catalog before rebuilding. Needed when the catalog was created
              # by a workspace that has since been deleted: UC catalogs live in the
              # regional metastore, so the orphan survives with storage this workspace
              # cannot reach, and every Volume write fails with `[Errno 22]`.
              # Override per run: `databricks bundle run ... --params reset=true`.
              reset: "${var.reset_catalog}"
              # Empty on metastores that own a storage root; required where Default
              # Storage is enabled and `CREATE CATALOG` demands an explicit location.
              storage_root: "${var.catalog_storage_root}"
              # Exact synced location of the contract registry (DAB syncs
              # ../contracts to <file_path>/contracts).
              contracts_src: "${workspace.file_path}/contracts"

