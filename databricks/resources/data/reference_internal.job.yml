# reference/internal — one job per system
# test data (optional) -> bronze -> silver -> gold, each a notebook task running
# nb_pipeline_driver.py with its target_layers, gated by enable_* parameters;
# nb_assert_layers_ran fails the run if an enabled layer left no run-log rows.
resources:
  jobs:
    reference_internal:
      name: '[${bundle.target}] pl_data_reference_internal'
      description: 'Test data -> bronze -> silver -> gold for reference/internal, each layer a notebook task in this one job.'
      tags:
        group: data
        domain: reference
        system: internal
        managed_by: lakelogic
      parameters:
      - name: enable_test_data
        default: 'true'
      - name: enable_bronze
        default: 'true'
      - name: enable_silver
        default: 'true'
      - name: enable_gold
        default: 'true'
      schedule:
        quartz_cron_expression: 0 0/30 * * * ?
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
      - task_key: check_run_test_data
        condition_task:
          op: EQUAL_TO
          left: '{{job.parameters.enable_test_data}}'
          right: 'true'
      - task_key: generate_test_data
        depends_on:
        - task_key: check_run_test_data
          outcome: 'true'
        run_job_task:
          job_id: ${resources.jobs.synthetic_seed_reference_internal.id}
      - task_key: check_run_bronze
        depends_on:
        - task_key: generate_test_data
        - task_key: check_run_test_data
          outcome: 'false'
        run_if: ALL_DONE
        condition_task:
          op: EQUAL_TO
          left: '{{job.parameters.enable_bronze}}'
          right: 'true'
      - task_key: bronze_ingestion
        depends_on:
        - task_key: check_run_bronze
          outcome: 'true'
        notebook_task:
          notebook_path: ../../notebooks/nb_pipeline_driver.py
          base_parameters:
            telemetry_scope: "${var.telemetry_scope}"
            observatory_endpoint: "${var.observatory_endpoint}"
            lakelogic_wheel: ${var.lakelogic_wheel}
            lakelogic_version: ${var.lakelogic_version}
            registry_path: /Volumes/${var.catalog}/nondelta/_contracts/reference/internal/_system.yaml
            environment: ${var.environment}
            engine: spark
            storage_mode: uc
            target_layers: bronze
            entity_filter: ''
            reset_layers: ''
            reload_layers: ''
            dry_run: 'false'
            ddl_only: 'false'
            reprocess_from: ''
            reprocess_to: ''
            reprocess_column: ''
            reprocess_values: ''
            created_by: ''
            show_dag: 'true'
            parallel: 'true'
            max_workers: '4'
            resil_retry_attempts: '1'
            resil_retry_wait_sec: '30'
            resil_timeout_min: '0'
            resil_max_failures: '0'
            resil_resume_run: ''
      - task_key: check_run_silver
        depends_on:
        - task_key: bronze_ingestion
        - task_key: check_run_bronze
          outcome: 'false'
        run_if: ALL_DONE
        condition_task:
          op: EQUAL_TO
          left: '{{job.parameters.enable_silver}}'
          right: 'true'
      - task_key: silver_processing
        depends_on:
        - task_key: check_run_silver
          outcome: 'true'
        notebook_task:
          notebook_path: ../../notebooks/nb_pipeline_driver.py
          base_parameters:
            telemetry_scope: "${var.telemetry_scope}"
            observatory_endpoint: "${var.observatory_endpoint}"
            lakelogic_wheel: ${var.lakelogic_wheel}
            lakelogic_version: ${var.lakelogic_version}
            registry_path: /Volumes/${var.catalog}/nondelta/_contracts/reference/internal/_system.yaml
            environment: ${var.environment}
            engine: spark
            storage_mode: uc
            target_layers: silver
            entity_filter: ''
            reset_layers: ''
            reload_layers: ''
            dry_run: 'false'
            ddl_only: 'false'
            reprocess_from: ''
            reprocess_to: ''
            reprocess_column: ''
            reprocess_values: ''
            created_by: ''
            show_dag: 'true'
            parallel: 'true'
            max_workers: '4'
            resil_retry_attempts: '1'
            resil_retry_wait_sec: '30'
            resil_timeout_min: '0'
            resil_max_failures: '0'
            resil_resume_run: ''
      - task_key: check_run_gold
        depends_on:
        - task_key: silver_processing
        - task_key: check_run_silver
          outcome: 'false'
        run_if: ALL_DONE
        condition_task:
          op: EQUAL_TO
          left: '{{job.parameters.enable_gold}}'
          right: 'true'
      - task_key: gold_aggregation
        depends_on:
        - task_key: check_run_gold
          outcome: 'true'
        notebook_task:
          notebook_path: ../../notebooks/nb_pipeline_driver.py
          base_parameters:
            telemetry_scope: "${var.telemetry_scope}"
            observatory_endpoint: "${var.observatory_endpoint}"
            lakelogic_wheel: ${var.lakelogic_wheel}
            lakelogic_version: ${var.lakelogic_version}
            registry_path: /Volumes/${var.catalog}/nondelta/_contracts/reference/internal/_system.yaml
            environment: ${var.environment}
            engine: spark
            storage_mode: uc
            target_layers: gold
            entity_filter: ''
            reset_layers: gold
            reload_layers: ''
            dry_run: 'false'
            ddl_only: 'false'
            reprocess_from: ''
            reprocess_to: ''
            reprocess_column: ''
            reprocess_values: ''
            created_by: ''
            show_dag: 'true'
            parallel: 'true'
            max_workers: '4'
            resil_retry_attempts: '1'
            resil_retry_wait_sec: '30'
            resil_timeout_min: '0'
            resil_max_failures: '0'
            resil_resume_run: ''
      - task_key: nb_assert_layers_ran
        depends_on:
        - task_key: gold_aggregation
        - task_key: check_run_gold
          outcome: 'false'
        run_if: ALL_DONE
        notebook_task:
          notebook_path: ../../notebooks/_ops/nb_assert_layers_ran.py
          base_parameters:
            catalog: ${var.catalog}
            domain: reference
            enable_bronze: '{{job.parameters.enable_bronze}}'
            enable_silver: '{{job.parameters.enable_silver}}'
            enable_gold: '{{job.parameters.enable_gold}}'
