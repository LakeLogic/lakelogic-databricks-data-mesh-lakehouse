# ══════════════════════════════════════════════════════════════════════════════
# Marketing / hubspot — Full Pipeline Orchestrator
# ══════════════════════════════════════════════════════════════════════════════
# Test Data → Bronze → Silver → Gold cascade with per-step toggles.
# Mirrors the marketplace/rideflow orchestrator pattern.
#
# Each step runs conditionally based on its enable_* parameter. Bronze
# waits for test data, silver waits for bronze, gold waits for silver —
# but ALL_DONE rules let downstream steps proceed even if an upstream
# step was skipped (e.g. enable_test_data=false → bronze still runs).

resources:
  jobs:
    marketing_orchestrator_hubspot:
      name: "[${bundle.target}] marketing / hubspot — Full Pipeline Orchestrator"
      description: "End-to-end medallion pipeline for marketing/hubspot: Test Data → Bronze → Silver → Gold."

      tags:
        domain: marketing
        system: hubspot
        layer: orchestrator
        managed_by: lakelogic

      parameters:
        # Run order: test_data → bronze → silver → gold. Each is independently
        # toggleable. Test data defaults ON for dev demos; flip to "false" for
        # production where landing data already exists.
        - name: enable_test_data
          default: "true"
        - name: enable_bronze
          default: "true"
        - name: enable_silver
          default: "true"
        - name: enable_gold
          default: "true"

      schedule:
        quartz_cron_expression: "0 0/30 * * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED

#       job_clusters:
#         - job_cluster_key: rideflow_compute
#           new_cluster:
#             spark_version: 16.4.x-scala2.12
#             node_type_id: Standard_DS3_v2
#             autoscale:
#               min_workers: 1
#               max_workers: 4
#             spark_env_vars:
#               RIDEFLOW_DEV_CATALOG: "{{secrets/rideflow/rideflow-dev-catalog}}"
#               RIDEFLOW_DEV_STORAGE_ACCOUNT: "{{secrets/rideflow/rideflow-dev-storage-account}}"
#               RIDEFLOW_STG_CATALOG: "{{secrets/rideflow/rideflow-stg-catalog}}"
#               RIDEFLOW_STG_STORAGE_ACCOUNT: "{{secrets/rideflow/rideflow-stg-storage-account}}"
#               RIDEFLOW_PROD_CATALOG: "{{secrets/rideflow/rideflow-prod-catalog}}"
#               RIDEFLOW_PROD_STORAGE_ACCOUNT: "{{secrets/rideflow/rideflow-prod-storage-account}}"
#               DOMAIN_CONTACT_MARKETING: "{{secrets/rideflow/domain-contact-marketing}}"
#               LAKELOGIC_OBSERVATORY_ENDPOINT: "{{secrets/rideflow/lakelogic-observatory-endpoint}}"
#               LAKELOGIC_API_KEY: "{{secrets/rideflow/lakelogic-api-key}}"

      tasks:
        # ── Step 0: Generate Test Data ─────────────────────────────────
        - task_key: check_run_test_data
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.enable_test_data}}"
            right: "true"

        - task_key: generate_test_data
          depends_on:
            - task_key: check_run_test_data
              outcome: "true"
          run_job_task:
            job_id: ${resources.jobs.marketing_test_data_hubspot.id}

        # ── Step 1: Bronze (waits for test_data branch to settle) ──────
        # When enable_test_data is true:  generate_test_data runs → completes → bronze fires.
        # When enable_test_data is false: check_run_test_data's "false" outcome fires → bronze fires.
        # ALL_DONE lets EITHER path complete the gate.
        - task_key: check_run_bronze
          depends_on:
            - task_key: generate_test_data
            - task_key: check_run_test_data
              outcome: "false"
          run_if: ALL_DONE
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.enable_bronze}}"
            right: "true"

        - task_key: bronze_ingestion
          depends_on:
            - task_key: check_run_bronze
              outcome: "true"
          # Delegates to the standalone bronze job (single source of truth)
          run_job_task:
            job_id: ${resources.jobs.marketing_bronze_hubspot.id}

        - task_key: check_run_silver
          depends_on:
            - task_key: bronze_ingestion
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.enable_silver}}"
            right: "true"

        - task_key: silver_processing
          depends_on:
            - task_key: check_run_silver
              outcome: "true"
          # Delegates to the standalone silver job (single source of truth)
          run_job_task:
            job_id: ${resources.jobs.marketing_silver_hubspot.id}

        - task_key: check_run_gold
          depends_on:
            - task_key: silver_processing
          condition_task:
            op: EQUAL_TO
            left: "{{job.parameters.enable_gold}}"
            right: "true"

        - task_key: gold_aggregation
          depends_on:
            - task_key: check_run_gold
              outcome: "true"
          # Delegates to the standalone gold job (single source of truth)
          run_job_task:
            job_id: ${resources.jobs.marketing_gold_hubspot.id}

