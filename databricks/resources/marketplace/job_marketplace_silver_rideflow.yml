# ══════════════════════════════════════════════════════════════════════════════
# RideFlow Marketplace — Silver Processing Job
# ══════════════════════════════════════════════════════════════════════════════
# Type casting, deduplication, and merge for 4 Silver entities.
# Entities: silver_rideflow_driver_profiles, silver_rideflow_driver_telemetry,
#           silver_rideflow_rider_profiles, silver_rideflow_trips

resources:
  jobs:
    marketplace_silver_rideflow:
      name: "[${bundle.target}] ${var.domain} / ${var.system} — 2 Silver Processing"
      description: "Type casting, deduplication, and merge of Bronze data into Silver Delta tables with schema enforcement."

      tags:
        domain: ${var.domain}
        system: ${var.system}
        layer: silver
        managed_by: lakelogic

      schedule:
        quartz_cron_expression: "0 15 */1 * * ?"  # Every hour at :15 (after Bronze)
        timezone_id: "UTC"
        pause_status: PAUSED

#       job_clusters:
#         - job_cluster_key: rideflow_compute
#           new_cluster:
#             spark_version: 16.4.x-scala2.12
#             node_type_id: Standard_DS3_v2
#             autoscale:
#               min_workers: 1
#               max_workers: 4
#             spark_env_vars:
#               RIDEFLOW_DEV_CATALOG: "{{secrets/rideflow/rideflow-dev-catalog}}"
#               RIDEFLOW_DEV_STORAGE_ACCOUNT: "{{secrets/rideflow/rideflow-dev-storage-account}}"
#               RIDEFLOW_STG_CATALOG: "{{secrets/rideflow/rideflow-stg-catalog}}"
#               RIDEFLOW_STG_STORAGE_ACCOUNT: "{{secrets/rideflow/rideflow-stg-storage-account}}"
#               RIDEFLOW_PROD_CATALOG: "{{secrets/rideflow/rideflow-prod-catalog}}"
#               RIDEFLOW_PROD_STORAGE_ACCOUNT: "{{secrets/rideflow/rideflow-prod-storage-account}}"
#               DOMAIN_CONTACT_MARKETPLACE: "{{secrets/rideflow/domain-contact-marketplace}}"
#               LAKELOGIC_OBSERVATORY_ENDPOINT: "{{secrets/rideflow/lakelogic-observatory-endpoint}}"
#               LAKELOGIC_API_KEY: "{{secrets/rideflow/lakelogic-api-key}}"

      tasks:
        - task_key: silver_processing
          notebook_task:
            notebook_path: ../../notebooks/pipeline_driver.py
            base_parameters:
              registry_path: "/Volumes/${var.catalog}/nondelta/_contracts/${var.domain}/${var.system}/_system.yaml"
              environment: "${bundle.target}"
              engine: "spark"
              storage_mode: "uc"
              target_layers: "silver"
              entity_filter: ""
              reset_layers: ""
              reload_layers: ""
              dry_run: "false"
              ddl_only: "false"
              reprocess_from: ""
              reprocess_to: ""
              reprocess_column: ""
              reprocess_values: ""
              created_by: ""
              show_dag: "true"
              parallel: "true"
              max_workers: "4"
              resil_retry_attempts: "1"
              resil_retry_wait_sec: "30"
              resil_timeout_min: "0"
              resil_max_failures: "0"
              resil_resume_run: ""

