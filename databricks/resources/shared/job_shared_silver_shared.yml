      tasks:
        - task_key: silver_run
          notebook_task:
            notebook_path: ../../notebooks/pipeline_driver.py
            base_parameters:
              registry_path: "/Volumes/${var.catalog}/nondelta/_contracts/_shared/_shared/_system.yaml"
              environment: "${bundle.target}"
              engine: "spark"
              storage_mode: "uc"
              target_layers: "silver"
              entity_filter: ""
              reset_layers: ""
              reload_layers: ""
              dry_run: "false"
              ddl_only: "false"
              reprocess_from: ""
              reprocess_to: ""
              reprocess_column: ""
              reprocess_values: ""
              created_by: ""
              show_dag: "true"
              parallel: "true"
              max_workers: "4"
              resil_retry_attempts: "1"
              resil_retry_wait_sec: "30"
              resil_timeout_min: "0"
              resil_max_failures: "0"
              resil_resume_run: ""

