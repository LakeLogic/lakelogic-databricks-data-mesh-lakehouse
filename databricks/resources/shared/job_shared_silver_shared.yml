resources:
  jobs:
    shared_silver_shared:
      name: "[${bundle.target}] _shared / _shared — 2 Silver Processing"
      description: "Silver-layer processing for the _shared/_shared pipeline."

      tags:
        domain: _shared
        system: _shared
        layer: silver
        managed_by: lakelogic

      schedule:
        quartz_cron_expression: "0 15 */1 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED

