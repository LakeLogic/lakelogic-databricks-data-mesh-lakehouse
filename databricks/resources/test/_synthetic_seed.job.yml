# ══════════════════════════════════════════════════════════════════════════════
# RideFlow Demo — Seed ALL systems (FK-consistent), one task per system seed job
# ══════════════════════════════════════════════════════════════════════════════
# Runs each system's own seed job (pl_test_synthetic_seed_<domain>_<system>) in
# foreign-key order. Each seed generates landing data AND builds its bronze+silver
# (build_bronze_silver=true), so a downstream seed reads REAL upstream ids from silver:
#   marketplace → marketing(ga, hubspot), checkr, stripe
#   marketplace + stripe → zendesk
# shared has no generator (gold-only), so it has no seed task.
resources:
  jobs:
    synthetic_seed:
      name: "[${bundle.target}] pl_test_synthetic_seed"
      description: "Runs every system seed job in FK dependency order (landing data + bronze+silver)."

      tags:
        group: test
        managed_by: lakelogic
        layer: seed

      tasks:
        - task_key: marketplace_rideflow
          run_job_task:
            job_id: ${resources.jobs.synthetic_seed_marketplace_rideflow.id}
        - task_key: reference_internal
          run_job_task:
            job_id: ${resources.jobs.synthetic_seed_reference_internal.id}
        - task_key: marketing_google_ads
          run_job_task:
            job_id: ${resources.jobs.synthetic_seed_marketing_google_ads.id}
        - task_key: marketing_meta_ads
          run_job_task:
            job_id: ${resources.jobs.synthetic_seed_marketing_meta_ads.id}
        - task_key: operations_twilio
          run_job_task:
            job_id: ${resources.jobs.synthetic_seed_operations_twilio.id}
        - task_key: marketing_google_analytics
          depends_on:
            - task_key: marketplace_rideflow
          run_job_task:
            job_id: ${resources.jobs.synthetic_seed_marketing_google_analytics.id}
        - task_key: marketing_hubspot
          depends_on:
            - task_key: marketplace_rideflow
          run_job_task:
            job_id: ${resources.jobs.synthetic_seed_marketing_hubspot.id}
        - task_key: operations_checkr
          depends_on:
            - task_key: marketplace_rideflow
          run_job_task:
            job_id: ${resources.jobs.synthetic_seed_operations_checkr.id}
        - task_key: payments_stripe
          depends_on:
            - task_key: marketplace_rideflow
          run_job_task:
            job_id: ${resources.jobs.synthetic_seed_payments_stripe.id}
        - task_key: operations_zendesk
          depends_on:
            - task_key: marketplace_rideflow
            - task_key: payments_stripe
          run_job_task:
            job_id: ${resources.jobs.synthetic_seed_operations_zendesk.id}
