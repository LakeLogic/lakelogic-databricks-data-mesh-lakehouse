<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">RideFlow cross-domain lineage</title>
  <desc id="desc">Payments, Marketplace, and Operations Silver products feed shared Gold revenue and driver 360 products.</desc>
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>.title{font:700 28px Arial;fill:#0f172a}.label{font:700 15px Arial;fill:#0f172a}.meta{font:12px Arial;fill:#64748b}.source{fill:#fff;stroke:#cbd5e1;stroke-width:2}.gold{fill:#fffbeb;stroke:#d97706;stroke-width:2}.line{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow2)}</style>
  </defs>
  <rect width="1200" height="450" rx="24" fill="#f8fafc"/>
  <text x="54" y="58" class="title">Cross-domain products keep their upstream lineage</text>
  <g transform="translate(64 105)"><rect class="source" width="310" height="78" rx="14"/><text x="20" y="31" class="label">Silver - Stripe Charges</text><text x="20" y="55" class="meta">PAYMENTS DOMAIN</text></g>
  <g transform="translate(64 205)"><rect class="source" width="310" height="78" rx="14"/><text x="20" y="31" class="label">Silver - RideFlow Trips</text><text x="20" y="55" class="meta">MARKETPLACE DOMAIN</text></g>
  <g transform="translate(64 305)"><rect class="source" width="310" height="78" rx="14"/><text x="20" y="31" class="label">Silver - Checkr Screenings</text><text x="20" y="55" class="meta">OPERATIONS DOMAIN</text></g>
  <g transform="translate(800 135)"><rect class="gold" width="330" height="84" rx="14"/><text x="22" y="34" class="label">Gold - Revenue Daily</text><text x="22" y="59" class="meta">SHARED CROSS-DOMAIN PRODUCT</text></g>
  <g transform="translate(800 275)"><rect class="gold" width="330" height="84" rx="14"/><text x="22" y="34" class="label">Gold - Driver 360</text><text x="22" y="59" class="meta">SHARED CROSS-DOMAIN PRODUCT</text></g>
  <path class="line" d="M374 144 C560 144 610 170 800 177"/><path class="line" d="M374 244 C560 244 610 190 800 177"/>
  <path class="line" d="M374 244 C560 244 610 317 800 317"/><path class="line" d="M374 344 C560 344 610 317 800 317"/><path class="line" d="M374 144 C560 144 650 290 800 317"/>
</svg>
