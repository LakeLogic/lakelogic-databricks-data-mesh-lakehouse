<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">RideFlow governed data mesh architecture</title>
  <desc id="desc">Six RideFlow domains own named source systems and Bronze, Silver, and Gold data products. They publish governed products to Unity Catalog, where LakeLogic applies contracts, creates quarantine records, and writes run logs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#14b8a6"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      .title{font-family:Arial,sans-serif;font-weight:700;fill:#0f172a}.body{font-family:Arial,sans-serif;fill:#334155}.small{font-family:Arial,sans-serif;fill:#475569}
    </style>
  </defs>
  <rect width="1200" height="850" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title" font-size="30">Governed data mesh on Databricks</text>
  <text x="60" y="88" class="small" font-size="16">Every domain owns named source systems and promotes contract-governed Bronze, Silver, and Gold data products.</text>

  <rect x="45" y="118" width="1110" height="422" rx="18" fill="#ecfeff" stroke="#22b8cf" stroke-width="2"/>
  <text x="72" y="150" class="title" font-size="18" fill="#0e7490">DATA MESH DOMAINS</text>

  <g>
    <rect x="70" y="174" width="330" height="142" rx="12" fill="#fff" stroke="#22b8cf" stroke-width="2"/>
    <text x="92" y="206" class="title" font-size="19" fill="#0f766e">Marketing</text>
    <text x="92" y="231" class="body" font-size="13">Google Ads · Meta Ads</text><text x="92" y="252" class="body" font-size="13">Google Analytics · HubSpot</text>
    <text x="92" y="282" class="title" font-size="14" fill="#a16207">Bronze</text><text x="180" y="282" class="body" font-size="16">→</text><text x="207" y="282" class="title" font-size="14" fill="#475569">Silver</text><text x="278" y="282" class="body" font-size="16">→</text><text x="304" y="282" class="title" font-size="14" fill="#a16207">Gold</text>

    <rect x="435" y="174" width="330" height="142" rx="12" fill="#fff" stroke="#22b8cf" stroke-width="2"/>
    <text x="457" y="206" class="title" font-size="19" fill="#0f766e">Marketplace</text>
    <text x="457" y="231" class="body" font-size="13">RideFlow</text><text x="457" y="252" class="body" font-size="13">trips · riders · drivers</text>
    <text x="457" y="282" class="title" font-size="14" fill="#a16207">Bronze</text><text x="545" y="282" class="body" font-size="16">→</text><text x="572" y="282" class="title" font-size="14" fill="#475569">Silver</text><text x="643" y="282" class="body" font-size="16">→</text><text x="669" y="282" class="title" font-size="14" fill="#a16207">Gold</text>

    <rect x="800" y="174" width="330" height="142" rx="12" fill="#fff" stroke="#22b8cf" stroke-width="2"/>
    <text x="822" y="206" class="title" font-size="19" fill="#0f766e">Operations</text>
    <text x="822" y="231" class="body" font-size="13">Checkr · Twilio</text><text x="822" y="252" class="body" font-size="13">Zendesk</text>
    <text x="822" y="282" class="title" font-size="14" fill="#a16207">Bronze</text><text x="910" y="282" class="body" font-size="16">→</text><text x="937" y="282" class="title" font-size="14" fill="#475569">Silver</text><text x="1008" y="282" class="body" font-size="16">→</text><text x="1034" y="282" class="title" font-size="14" fill="#a16207">Gold</text>

    <rect x="70" y="350" width="330" height="142" rx="12" fill="#fff" stroke="#22b8cf" stroke-width="2"/>
    <text x="92" y="382" class="title" font-size="19" fill="#0f766e">Payments</text>
    <text x="92" y="407" class="body" font-size="13">Stripe</text><text x="92" y="428" class="body" font-size="13">charges · refunds · payouts</text>
    <text x="92" y="458" class="title" font-size="14" fill="#a16207">Bronze</text><text x="180" y="458" class="body" font-size="16">→</text><text x="207" y="458" class="title" font-size="14" fill="#475569">Silver</text><text x="278" y="458" class="body" font-size="16">→</text><text x="304" y="458" class="title" font-size="14" fill="#a16207">Gold</text>

    <rect x="435" y="350" width="330" height="142" rx="12" fill="#fff" stroke="#22b8cf" stroke-width="2"/>
    <text x="457" y="382" class="title" font-size="19" fill="#0f766e">Reference</text>
    <text x="457" y="407" class="body" font-size="13">shared lookup</text><text x="457" y="428" class="body" font-size="13">dimensions and codes</text>
    <text x="457" y="458" class="title" font-size="14" fill="#a16207">Bronze</text><text x="545" y="458" class="body" font-size="16">→</text><text x="572" y="458" class="title" font-size="14" fill="#475569">Silver</text><text x="643" y="458" class="body" font-size="16">→</text><text x="669" y="458" class="title" font-size="14" fill="#a16207">Gold</text>

    <rect x="800" y="350" width="330" height="142" rx="12" fill="#fff" stroke="#22b8cf" stroke-width="2"/>
    <text x="822" y="382" class="title" font-size="19" fill="#0f766e">Shared</text>
    <text x="822" y="407" class="body" font-size="13">cross-domain reporting</text><text x="822" y="428" class="body" font-size="13">and marts</text>
    <text x="822" y="458" class="title" font-size="14" fill="#a16207">Bronze</text><text x="910" y="458" class="body" font-size="16">→</text><text x="937" y="458" class="title" font-size="14" fill="#475569">Silver</text><text x="1008" y="458" class="body" font-size="16">→</text><text x="1034" y="458" class="title" font-size="14" fill="#a16207">Gold</text>
  </g>

  <g stroke="#14b8a6" stroke-width="3" marker-end="url(#arrow)">
    <path d="M235 316 L430 590"/><path d="M600 316 L550 590"/><path d="M965 316 L670 590"/>
    <path d="M235 492 L470 590"/><path d="M600 492 L550 590"/><path d="M965 492 L630 590"/>
  </g>
  <ellipse cx="550" cy="642" rx="260" ry="62" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="550" y="635" text-anchor="middle" class="title" font-size="24" fill="#1d4ed8">Unity Catalog</text>
  <text x="550" y="664" text-anchor="middle" class="body" font-size="14">governed data products · domain schemas · volumes</text>

  <path d="M810 642 L905 642" stroke="#14b8a6" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="925" y="565" width="230" height="150" rx="16" fill="#f0fdfa" stroke="#14b8a6" stroke-width="3"/>
  <text x="1040" y="605" text-anchor="middle" class="title" font-size="20" fill="#0f766e">LakeLogic OSS</text>
  <text x="1040" y="635" text-anchor="middle" class="body" font-size="14">contracts as code</text>
  <text x="1040" y="660" text-anchor="middle" class="body" font-size="14">quality gates</text>
  <text x="1040" y="685" text-anchor="middle" class="body" font-size="14">quarantine + run logs</text>
  <path d="M1040 715 L1040 758" stroke="#ef4444" stroke-width="3" marker-end="url(#arrowGray)"/>
  <rect x="888" y="762" width="305" height="58" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="1040" y="797" text-anchor="middle" class="title" font-size="16" fill="#b91c1c">Quarantine: failed records retained</text>
</svg>
