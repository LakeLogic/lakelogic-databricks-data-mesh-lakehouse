  <text x="66" y="197" class="display" font-size="42" fill="#f7f8f8">A governed lakehouse, owned by domains.</text>
  <text x="66" y="232" class="body" font-size="18" fill="#9badb2">Six RideFlow domains publish independent data products. Shared controls keep the mesh coherent.</text>

