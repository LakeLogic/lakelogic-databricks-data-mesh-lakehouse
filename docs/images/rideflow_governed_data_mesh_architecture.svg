<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">RideFlow governed data mesh architecture</title>
  <desc id="desc">Six RideFlow domains publish contract-governed Bronze, Silver, and Gold data products to a Databricks Unity Catalog lakehouse. LakeLogic provides shared contract execution, quality gates, lineage evidence, and quarantine routing.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071014"/>
      <stop offset="0.56" stop-color="#0a171b"/>
      <stop offset="1" stop-color="#071215"/>
    </linearGradient>
    <linearGradient id="lakehouse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d5f68"/>
      <stop offset="0.5" stop-color="#0a7d86"/>
      <stop offset="1" stop-color="#0d5f68"/>
    </linearGradient>
    <linearGradient id="control" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10252a"/>
      <stop offset="1" stop-color="#0b1a1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#18b8bd" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#18b8bd" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4ad7d1" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#46d3cf"/>
    </marker>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#ff6168"/>
    </marker>
    <style>
      .display{font-family:'Aptos Display','Trebuchet MS',sans-serif;font-weight:700;letter-spacing:-0.025em}
      .label{font-family:'Aptos','Trebuchet MS',sans-serif;font-weight:700;letter-spacing:0.12em}
      .body{font-family:'Aptos','Trebuchet MS',sans-serif;font-weight:400}
      .mono{font-family:'Cascadia Code','Courier New',monospace;font-weight:600}
    </style>
  </defs>

