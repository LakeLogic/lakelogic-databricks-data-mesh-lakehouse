version: 1.0.0

info:
  title: "Gold — Dim Cancellation Reason"
  table_name: "{gold_layer}__internal_dim_cancellation_reason"
  description: >
    Coded cancellation reasons for both riders and drivers. Drives the
    cancellation segmentation that Zeus uses when triaging completion-rate
    drops in marketplace_health.
  target_layer: gold
  domain: _reference
  system: _internal

model:
  fields:
    - name: reason_code
      type: string
      required: true
      description: "Internal code (e.g. RIDER_CHANGED_MIND, DRIVER_NO_SHOW)"
    - name: reason_label
      type: string
      description: "User-facing label"
    - name: actor
      type: string
      description: "Who cancelled: rider | driver | system"
    - name: charge_cancellation_fee
      type: boolean
    - name: counts_against_driver_rating
      type: boolean
    - name: severity
      type: string
      description: "low | medium | high — drives ops alerting"

quality:
  row_rules: []
  dataset_rules:
    - unique: reason_code

primary_key: [reason_code]

source:
  type: landing
  path: "{landing_root}/dim_cancellation_reason_seed"
  format: csv
  options:
    header: "true"
  load_mode: full
  watermark_strategy: none
