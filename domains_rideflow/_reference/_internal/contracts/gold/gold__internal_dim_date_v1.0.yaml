version: 1.0.0

info:
  title: "Gold — Dim Date"
  table_name: "{gold_layer}__internal_dim_date"
  description: >
    Canonical date dimension covering 2020-01-01 .. 2030-12-31. Materialized
    entirely by a Python generator (no upstream source); the bootstrap seed
    file is empty. Used by every fact_ table that needs date attributes.
  target_layer: gold
  domain: _reference
  system: _internal

model:
  fields:
    - name: date_key
      type: int
      required: true
      description: "Numeric key (YYYYMMDD)"
    - name: full_date
      type: date
      required: true
    - name: year
      type: int
    - name: quarter
      type: int
    - name: month
      type: int
    - name: month_name
      type: string
    - name: day
      type: int
    - name: day_of_week
      type: int
    - name: day_name
      type: string
    - name: is_weekend
      type: boolean
    - name: iso_week
      type: int
    - name: is_holiday_us
      type: boolean
    - name: is_holiday_uk
      type: boolean

quality:
  row_rules: []
  dataset_rules:
    - unique: date_key

primary_key: [date_key]

# Bootstrap: empty CSV (header only) so the pipeline has a valid source DF.
# External logic generates the actual calendar rows.
source:
  type: landing
  path: "{landing_root}/dim_date_seed"
  format: csv
  options:
    header: "true"
  load_mode: full
  watermark_strategy: none

external_logic:
  type: python
  # Path is resolved relative to the contract YAML's directory (its
  # _base_path). This contract lives at
  #   _reference/_internal/contracts/gold/gold__internal_dim_date_v1.0.yaml
  # and the generator lives at
  #   _reference/_internal/_generators/dim_date.py
  # so we climb two levels.
  # The wrapper imports OSS calendar: lakelogic.core.dim_date.generate_date_dimension.
  path: "../../_generators/dim_date.py"
  entrypoint: "run"
  args:
    start_date: "2020-01-01"
    end_date: "2030-12-31"
    fiscal_year_start_month: 4   # April fiscal year
