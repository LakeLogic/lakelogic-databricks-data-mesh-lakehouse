version: 1.0.0

info:
  title: "Silver — Internal Cities"
  table_name: "{silver_layer}__internal_cities"
  description: >
    Cleaned + typed city master. Deduplicated on city_code, validated against
    ISO country codes and IANA timezones. Feeds dim_city (SCD2) and is joined
    by every fact_ table that needs geographic attribution.
  target_layer: silver
  domain: _reference
  system: _internal

model:
  fields:
    - name: city_code
      type: string
      required: true
    - name: city_name
      type: string
    - name: country_code
      type: string
    - name: timezone
      type: string
    - name: default_currency
      type: string
    - name: geofence_wkt
      type: string
    - name: launched_at
      type: timestamp
    - name: sunset_at
      type: timestamp
    - name: is_active
      type: boolean
      description: "Derived: sunset_at IS NULL"

quality:
  row_rules: []
  dataset_rules:
    - unique: city_code

transformations:
  - deduplicate:
      by:
        - city_code

source:
  type: table
  path: 'table:{domain_catalog}.{bronze_layer}_{system}_city_master'
  load_mode: full
