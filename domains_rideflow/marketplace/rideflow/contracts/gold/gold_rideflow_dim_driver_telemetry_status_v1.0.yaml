version: 1.0.0
info:
  title: Gold — Dim Driver Telemetry Status
  target_layer: gold
  description: 'grain: one row per status'
  table_name: '{gold_layer}_rideflow_dim_driver_telemetry_status'
  system: rideflow
  domain: marketplace
model:
  fields:
  - name: status_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: status
    type: string
    required: true
    description: Dimension attribute 'status', projected from the 'driver_telemetry_status'
      entity.
dataset: gold_rideflow_dim_driver_telemetry_status
primary_key:
- status
quality:
  dataset_rules:
  - unique:
      columns:
      - status
      name: status_unique
      category: uniqueness
      description: No two rows share the same status.
natural_key:
- status
materialization:
  strategy: merge
  scd1:
    surrogate_key: status_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'
transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT status
    FROM source
    WHERE status IS NOT NULL
source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_driver_telemetry
  load_mode: incremental
  watermark_field: _lakelogic_processed_at
metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
