version: 1.0.0
info:
  title: Gold — Dim Platform
  target_layer: gold
  description: 'grain: one row per platform'
  table_name: '{gold_layer}_rideflow_dim_platform'
  system: rideflow
  domain: marketplace
model:
  fields:
  - name: platform_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: platform
    type: string
    required: true
    description: Dimension attribute 'platform', projected from the 'platform' entity.
dataset: gold_rideflow_dim_platform
primary_key:
- platform
quality:
  dataset_rules:
  - unique:
      columns:
      - platform
      name: platform_unique
      category: uniqueness
      description: No two rows share the same platform.
natural_key:
- platform
materialization:
  strategy: merge
  scd1:
    surrogate_key: platform_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'
transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT platform
    FROM source
    WHERE platform IS NOT NULL
source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_rider_app_events
  load_mode: incremental
  watermark_field: _lakelogic_processed_at
metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
