version: 1.0.0
info:
  title: Gold — Dim Trip Type
  target_layer: gold
  description: 'grain: one row per trip_type'
  table_name: '{gold_layer}_rideflow_dim_trip_type'
  system: rideflow
  domain: marketplace
model:
  fields:
  - name: trip_type_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: trip_type
    type: string
    required: true
    description: Dimension attribute 'trip_type', projected from the 'trip_type' entity.
dataset: gold_rideflow_dim_trip_type
primary_key:
- trip_type
quality:
  dataset_rules:
  - unique:
      columns:
      - trip_type
      name: trip_type_unique
      category: uniqueness
      description: No two rows share the same trip_type.
natural_key:
- trip_type
materialization:
  strategy: merge
  scd1:
    surrogate_key: trip_type_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'
links:
- name: silver_rideflow_trip_requests
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_trip_requests
transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT trip_type
    FROM (
      SELECT trip_type FROM source
      UNION ALL
      SELECT trip_type FROM silver_rideflow_trip_requests
    ) codes
    WHERE trip_type IS NOT NULL
source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_trips
  load_mode: incremental
  watermark_field: _lakelogic_processed_at
metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
