version: 1.0.0

info:
  title: "Gold — Fact Rider Daily Metrics"
  table_name: "{gold_layer}_rideflow_fact_rider_daily_metrics"
  description: "Daily aggregated rider metrics. Can be safely reprocessed and summed over time to calculate Lifetime Value."
  target_layer: gold
  domain: marketplace
  system: rideflow

source:
  type: table
  path: "table:{domain_catalog}.silver_rideflow_trips"
  load_mode: full

primary_key: [rider_id, activity_date]

links:
  - name: silver_trips_full
    path: "table:{domain_catalog}.silver_rideflow_trips"
    type: table
  # Conformed SCD2 dimension, for the surrogate-key (as-of) lookup below.
  - name: dim_rider
    path: "table:{domain_catalog}.gold_rideflow_dim_rider"
    type: table

model:
  fields:
    # Kimball surrogate FK to gold_rideflow_dim_rider, resolved SCD2-accurately by
    # activity_date. Riders with no matching dim row (e.g. profile quarantined)
    # resolve to the '-1' unknown member rather than a dangling key.
    - name: rider_sk
      type: string
      required: true
      foreign_key:
        contract: gold_rideflow_dim_rider
        column: rider_sk
    - name: rider_id
      type: string
      required: true
    - name: activity_date
      type: date
      required: true
    - name: daily_trips
      type: integer
    - name: daily_spend
      type: float
    - name: daily_tips
      type: float
    - name: avg_daily_rating
      type: float

transformations:
  # phase: pre — this SQL PRODUCES the model's required columns (activity_date, …).
  # Schema enforcement runs before post-phase transforms, so a post-phase
  # aggregation would see the raw source (no activity_date) and quarantine every
  # row, yielding 0 output. Running pre-phase materialises the aggregate first,
  # then schema-validates the shaped output.
  - phase: pre
    sql: |
      WITH agg AS (
        SELECT
            rider_id,
            DATE(requested_at)         AS activity_date,
            COUNT(*)                   AS daily_trips,
            SUM(fare_amount)           AS daily_spend,
            SUM(tip_amount)            AS daily_tips,
            AVG(rider_rating)          AS avg_daily_rating
        -- Read the FULL Silver table (via link) so aggregates
        -- (COUNT, SUM, AVG) include ALL rows for each date —
        -- not just the incremental slice.  The Jinja guard below
        -- limits WHICH dates are recomputed, then merge upserts
        -- the corrected totals into Gold.
        FROM silver_trips_full
        WHERE rider_id IS NOT NULL
        -- Only re-aggregate dates that received new trips.
        -- On a full load, `source` contains everything, so this safely selects all dates.
        AND DATE(requested_at) IN (SELECT DISTINCT DATE(requested_at) FROM source)
        GROUP BY rider_id, DATE(requested_at)
      )
      -- SCD2-accurate surrogate-key lookup: match the dim_rider version that was
      -- in effect ON the activity_date, using the half-open interval
      -- [effective_from, effective_to).  Riders absent from the dim (e.g. profile
      -- quarantined at Silver) get the '-1' unknown member, never a NULL/dangling FK.
      SELECT
          COALESCE(d.rider_sk, '-1')  AS rider_sk,
          a.rider_id,
          a.activity_date,
          a.daily_trips,
          a.daily_spend,
          a.daily_tips,
          a.avg_daily_rating
      FROM agg a
      LEFT JOIN dim_rider d
        ON  a.rider_id      =  d.rider_id
        AND a.activity_date >= CAST(d.effective_from AS DATE)
        AND a.activity_date <  CAST(d.effective_to   AS DATE)


downstream:
  - type: table
    name: "gold_marketing_funnel"
    platform: databricks
    owner: "analytics-team"
    managed: false 

  - type: report
    name: "rider_daily_metrics_dashboard"
    platform: powerbi
    owner: "analytics-team"
    managed: false

  - type: report
    name: "lifetime_value_report"
    platform: powerbi
    owner: "analytics-team"
    managed: false
    
  - type: api
    name: "Rider Daily Metrics API"
    platform: internal
    owner: "backend-team"
