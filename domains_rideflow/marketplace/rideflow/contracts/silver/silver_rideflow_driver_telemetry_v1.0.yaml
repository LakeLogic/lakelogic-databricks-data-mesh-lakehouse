version: 1.0.0
info:
  title: "Silver — Rideflow Driver Telemetry"
  table_name: '{silver_layer}_rideflow_driver_telemetry'
  description: Cleaned, typed, and deduplicated data.
  target_layer: silver
  domain: marketplace
  system: rideflow

primary_key: [telemetry_id]

model:
  fields:
  - name: telemetry_id
    type: string
    required: true
  - name: driver_id
    type: string
    required: true
  - name: gps_lat
    type: string
  - name: gps_lng
    type: string
  - name: speed_kmh
    type: float
  - name: heading
    type: string
  - name: accuracy_meters
    type: string
  - name: trip_id
    type: string
  - name: status
    type: string
  - name: city_code
    type: string
  - name: country_code
    type: string
    description: "ISO 3166-1 alpha-2 country of city_code — the partition key (materialization._all in _system.yaml)"
  - name: timestamp
    type: timestamp
quality:
  row_rules: []
  dataset_rules:
  - unique: telemetry_id
transformations:
- deduplicate:
    by:
    - telemetry_id
    sort_by: [timestamp]
    order: desc
source:
  type: table
  path: 'table:{domain_catalog}.{bronze_layer}_{system}_driver_telemetry'
  load_mode: full
