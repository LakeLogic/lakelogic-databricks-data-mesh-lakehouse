version: 1.0.0
info:
  title: "Silver — Rideflow Rider App Events"
  table_name: '{silver_layer}_rideflow_rider_app_events'
  description: >
    Cleaned, typed, deduplicated rider mobile-app interaction stream.
    Used by funnel + engagement marts (e.g. open → request → completed).
    device_id and ip_address are masked at Silver; rider_id is hashed
    to preserve cross-table join key while protecting PII.
  target_layer: silver
  domain: marketplace
  system: rideflow
upstream_contracts:
  - contract: bronze_rideflow_rider_app_events
    layer: bronze
    domain: marketplace
    system: rideflow
primary_key: [event_id]
model:
  fields:
    - name: event_id
      type: string
      required: true
    - name: rider_id
      type: string
      required: true
      pii: true
      masking: hash
      foreign_key:
        contract: "{silver_layer}_rideflow_rider_profiles"
        column: rider_id
    - name: device_id
      type: string
      pii: true
      masking: hash
    - name: ip_address
      type: string
      pii: true
      masking: redact
    - name: event_name
      type: string
      required: true
      description: "Event type (screen_view | button_tap | search | ...)"
    - name: screen_name
      type: string
    - name: event_timestamp
      type: timestamp
      required: true
    - name: app_version
      type: string
    - name: platform
      type: string
      description: "ios | android"
    - name: city_code
      type: string
    - name: event_properties_json
      type: string
      description: "Raw event properties as JSON string."
quality:
  row_rules:
    - name: event_id_not_null
      sql: "event_id IS NOT NULL"
    - name: rider_id_not_null
      sql: "rider_id IS NOT NULL"
    - name: valid_platform
      sql: "platform IS NULL OR platform IN ('ios','android')"
  dataset_rules:
    - unique: event_id
transformations:
  - deduplicate:
      by:
        - event_id
source:
  type: table
  path: 'table:{domain_catalog}.{bronze_layer}_{system}_rider_app_events'
  load_mode: full
