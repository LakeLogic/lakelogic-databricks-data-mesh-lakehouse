version: 1.0.0
info:
  title: "Silver — Rideflow Trip Requests"
  table_name: '{silver_layer}_rideflow_trip_requests'
  description: >
    Cleaned, typed, deduplicated trip request events. Each row is a
    requested ride/delivery BEFORE assignment. Downstream marts join
    this with `silver_rideflow_trips` to compute request → completion
    conversion and dispatch latency KPIs.
  target_layer: silver
  domain: marketplace
  system: rideflow
upstream_contracts:
  - contract: bronze_rideflow_trip_requests
    layer: bronze
    domain: marketplace
    system: rideflow
primary_key: [request_id]
model:
  fields:
    - name: request_id
      type: string
      required: true
    - name: rider_id
      type: string
      required: true
      pii: true
      masking: hash
      foreign_key:
        contract: "{silver_layer}_rideflow_rider_profiles"
        column: rider_id
    - name: trip_type
      type: string
      description: "ride | eats_delivery"
    - name: pickup_lat
      type: float
    - name: pickup_lng
      type: float
    - name: dropoff_lat
      type: float
    - name: dropoff_lng
      type: float
    - name: city_code
      type: string
    - name: requested_at
      type: timestamp
      required: true
    - name: estimated_fare
      type: float
    - name: estimated_eta_minutes
      type: integer
    - name: surge_multiplier
      type: float
quality:
  row_rules:
    - name: request_id_not_null
      sql: "request_id IS NOT NULL"
    - name: rider_id_not_null
      sql: "rider_id IS NOT NULL"
    - name: valid_trip_type
      sql: "trip_type IS NULL OR trip_type IN ('ride','eats_delivery')"
    - name: surge_in_range
      sql: "surge_multiplier IS NULL OR (surge_multiplier >= 1.0 AND surge_multiplier <= 10.0)"
  dataset_rules:
    - unique: request_id
transformations:
  - deduplicate:
      by:
        - request_id
source:
  type: table
  path: 'table:{domain_catalog}.{bronze_layer}_{system}_trip_requests'
  load_mode: full
