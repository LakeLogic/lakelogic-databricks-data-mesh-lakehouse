domain: operations

# ── Domain Ownership ────────────────────────────────────────────────────────
ownership:
  domain_owner: "Trust & Safety Team"
  team: trust_and_safety
  contacts:
  - name: Trust & Safety Data Lead
    role: oncall
    email: trust-safety-data@rideflow.com
  cost_center: trust_safety
  jira_project: OPSDATA

# ── Service Level Objectives (SLOs) ──────────────────────────────────────
slo:
  freshness:
    bronze:
      max_delay_minutes: 120
      check_columns: ["_lakelogic_processed_at"]
    silver:
      max_delay_minutes: 360
      check_columns: ["_lakelogic_processed_at"]
  row_count:
    bronze:
      min_rows: 1
      max_rows: 100000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2.0
        method: "median"
        min_runs_before_enforcement: 5
    silver:
      min_rows: 1
      max_rows: 100000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2.0
        method: "median"
        min_runs_before_enforcement: 5

  quality:
    min_good_ratio: 0.95
    max_quarantine_ratio: 0.05
    by_severity:
      critical:
        min_good_ratio: 0.999
      high:
        min_good_ratio: 0.99
      medium:
        min_good_ratio: 0.95
      low:
        min_good_ratio: 0.90


# What Contract Health scores declared checks against (OLC quality_coverage).
quality_coverage:
  silver:
    field_check_target: 0.7
  gold:
    require: [grain_unique, referential_integrity]

# ── Cost Governance ──────────────────────────────────────────────────────────
cost:
  currency: "GBP"
  budget:
    daily_limit: 15.00
    weekly_limit: 75.00
    monthly_limit: 250.00
    per_run_anomaly_multiplier: 3.0
    alert_channels: ["slack", "email"]

# ── Observatory Telemetry ────────────────────────────────────────────────────
observatory:
  enabled: true
  environments: [dev, prod, staging, local, local_polars]
  # Resolved at runtime from LAKELOGIC_OBSERVATORY_ENDPOINT — set by the
  # notebooks (nb_pipeline_driver, test_data_driver_all). Hardcoding a port
  # drifted every time the local API moved (8001 → 8012 etc.). Use the env
  # var so all four domains stay aligned with the running backend.
  endpoint: "${LAKELOGIC_OBSERVATORY_ENDPOINT}"
  api_key: "${LAKELOGIC_API_KEY}"
  emit_on: [success, partial, failed]

# ── Compliance & Privacy ─────────────────────────────────────────────────────
compliance:
  erasure:
    strategy: nullify

# Layer aliases
bronze_layer: bronze
silver_layer: silver
gold_layer: gold

# ── Data Products ──────────────────────────────────────────────────────────
products:
  - id: customer_support
    name: Customer Support
    description: Support tickets enriched with trip and payment context.
    lifecycle: active
    expected_outputs:
    - id: fact_ticket_enriched
      name: Enriched Tickets
      kind: table
