version: 1.0.0
info:
  title: "Silver — Checkr Driver Verifications"
  table_name: '{silver_layer}_checkr_driver_verifications'
  # Naming note: the Checkr REST API calls this entity "background_checks",
  # which is the Bronze table name. We rename to "driver_verifications" at
  # Silver because the business meaning ("we verified the driver") is
  # clearer than the API noun ("we ran a background check"). The
  # ``source.path`` and ``upstream_contracts`` block below make the
  # rename explicit so lineage tooling doesn't have to infer it.
  description: Cleaned, typed, deduplicated background-check results expressed as driver verifications.
  target_layer: silver
  domain: operations
  system: checkr
upstream_contracts:
  - contract: bronze_checkr_background_checks
    domain: operations
    system: checkr
    layer: bronze
    note: "Same physical data, business-friendly rename at Silver."
model:
  fields:
  - name: report_id
    type: string
    required: true
  - name: driver_id
    type: string
    required: true
    pii: true
    masking: hash
  - name: full_name
    type: string
    pii: true
    masking: redact
  - name: date_of_birth
    type: string
    pii: true
    masking: hash
  - name: ssn_last_four
    type: string
    pii: true
    masking: hash
  - name: licence_number
    type: string
    pii: true
    masking: hash
  - name: address
    type: string
    pii: true
    masking: redact
  - name: status
    type: string
  - name: result
    type: string
  - name: completed_at
    type: timestamp
  - name: created_at
    type: timestamp
  - name: adjudication
    type: string
primary_key: [report_id]
quality:
  row_rules: []
  dataset_rules:
  - unique: report_id
transformations:
- deduplicate:
    by:
    - report_id
source:
  type: table
  path: 'table:{domain_catalog}.{bronze_layer}_{system}_background_checks'
  load_mode: full
