version: 1.0.0

info:
  title: "Bronze — Zendesk Support Tickets"
  table_name: "{bronze_layer}_{system}_support_tickets"
  description: >
    Raw support ticket data from Zendesk. One row per ticket.
  target_layer: bronze
  domain: operations
  system: zendesk

model:
  fields:
    - name: ticket_id
      type: string
      required: true
      description: "Zendesk ticket ID"
    # ── FK fields populated based on entry_point (see below) ─────────────
    - name: entry_point
      type: string
      description: "How the ticket was filed — determines which FKs are populated"
      # Distribution (per real Uber/Lyft):
      #   in_app_trip  ~55%  → rider + trip + driver (+ maybe charge)
      #   in_app_help  ~15%  → rider only (no trip / no driver)
      #   email        ~20%  → rider + sometimes trip
      #   phone        ~10%  → rider + sometimes trip
    - name: rider_id
      type: string
      description: "FK to marketplace rider (~85% populated)"
      foreign_key:
        contract: "{bronze_layer}_rideflow_rider_profiles"
        column: rider_id
    - name: trip_id
      type: string
      description: "FK to marketplace trip (~75% — present when ticket originates from a trip)"
      foreign_key:
        contract: "{bronze_layer}_rideflow_trip_completed"
        column: trip_id
    - name: driver_id
      type: string
      description: "FK to marketplace driver (~55% — present when ticket about a driver)"
      foreign_key:
        contract: "{bronze_layer}_rideflow_driver_profiles"
        column: driver_id
    - name: charge_id
      type: string
      description: "FK to stripe charge (~25% — present on payment/refund tickets)"
      foreign_key:
        contract: "{bronze_layer}_stripe_charges"
        column: charge_id
    # ── Requester contact (was previously the only identifier) ───────────
    - name: requester_email
      type: string
      required: true
      pii: true
      description: "Requester email"
    - name: requester_name
      type: string
      pii: true
      description: "Requester display name"
    - name: requester_phone
      type: string
      pii: true
      description: "Requester phone number"
    - name: subject
      type: string
      description: "Ticket subject"
    - name: ticket_description
      type: string
      pii: true
      description: "Ticket body (may contain PII)"
    - name: status
      type: string
      description: "new, open, pending, solved, closed"
    - name: priority
      type: string
      description: "low, normal, high, urgent"
    - name: channel
      type: string
      description: "email, chat, phone, web"
    - name: assignee
      type: string
      description: "Assigned agent"
    - name: tags_json
      type: string
      description: "Tags array as JSON"
    - name: created_at
      type: string
      description: "Ticket creation timestamp"
    - name: updated_at
      type: string
      description: "Last update timestamp"
    - name: solved_at
      type: string
      description: "Resolution timestamp"
    - name: satisfaction_rating
      type: string
      description: "CSAT score"

source:
  type: landing
  path: "{landing_root}/support_tickets"
  format: csv
  options:
    header: "true"
    recursiveFileLookup: "true"
  load_mode: incremental
  watermark_strategy: pipeline_log
  partition:
    # Generator writes hourly partitions (y/m/d/h_HH), so the format must include
    # the hour level — otherwise a full-load partition scan looks in the daily
    # folder and misses the files one level deeper.
    format: "y_%Y/m_%m/d_%d/h_%H"
