domain: payments

# ── Domain Ownership ────────────────────────────────────────────────────────
ownership:
  domain_owner: "Finance Engineering"
  team: finance_engineering
  contacts:
  - name: Finance Data Lead
    role: oncall
    email: finance-data@rideflow.com
  cost_center: finance_ops
  jira_project: PAYMENTS

# ── Service Level Objectives (SLOs) ──────────────────────────────────────
slo:
  freshness:
    bronze:
      max_delay_minutes: 120
      check_columns: ["_lakelogic_processed_at"]
    silver:
      max_delay_minutes: 300
      check_columns: ["_lakelogic_processed_at"]
  row_count:
    bronze:
      min_rows: 1
      max_rows: 200000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2.0
        method: "median"
        min_runs_before_enforcement: 5
    silver:
      min_rows: 1
      max_rows: 200000
      warn_only: false
      anomaly:
        enabled: true
        lookback_runs: 14
        min_ratio: 0.5
        max_ratio: 2.0
        method: "median"
        min_runs_before_enforcement: 5

  quality:
    min_good_ratio: 0.99
    max_quarantine_ratio: 0.01
    by_severity:
      critical:
        min_good_ratio: 0.9999
      high:
        min_good_ratio: 0.999
      medium:
        min_good_ratio: 0.99
      low:
        min_good_ratio: 0.95


# ── Cost Governance ──────────────────────────────────────────────────────────
cost:
  currency: "GBP"
  budget:
    daily_limit: 25.00
    weekly_limit: 125.00
    monthly_limit: 400.00
    per_run_anomaly_multiplier: 3.0
    alert_channels: ["slack", "email"]

# ── Observatory Telemetry ────────────────────────────────────────────────────
observatory:
  # Endpoint and key resolve from the env vars the notebooks set from the
  # Databricks secret scope — never inline. Set `enabled: false` to opt out.
  enabled: true
  environments: [dev, prod, staging, local, local_polars]
  endpoint: "${LAKELOGIC_OBSERVATORY_ENDPOINT}"
  api_key: "${LAKELOGIC_API_KEY}"
  emit_on: [success, partial, failed]

# ── Compliance & Privacy ─────────────────────────────────────────────────────
compliance:
  erasure:
    strategy: hash   # financial PII requires pseudonymization for audit trails

# Layer aliases
bronze_layer: bronze
silver_layer: silver
gold_layer: gold

# ── Data Products ──────────────────────────────────────────────────────────
products:
  - id: payment_reconciliation
    name: Payment Reconciliation
    description: Charges, refunds and payouts reconciled against trips.
    lifecycle: active
    expected_outputs:
    - id: fact_payment_reconciliation
      name: Payment Reconciliation
      kind: table
