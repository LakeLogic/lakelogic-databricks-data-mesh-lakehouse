version: 1.0.0

info:
  title: "Bronze — Internal City Master"
  table_name: "{bronze_layer}_{system}_city_master"
  description: >
    Raw city master file from the operations team. Defines every city the
    platform operates in, with timezone, default currency, country, geofence
    polygon, surge config, and launch / sunset dates. Periodically reloaded
    when ops onboards / off-boards a market.
  target_layer: bronze
  domain: reference
  system: internal

model:
  fields:
    - name: city_code
      type: string
      required: true
      description: "Internal stable code (e.g. LON, NYC, BLR)"
    - name: city_name
      type: string
      description: "Display name"
    - name: country_code
      type: string
      description: "ISO 3166-1 alpha-3 country code"
    - name: timezone
      type: string
      description: "IANA timezone (e.g. Europe/London)"
    - name: default_currency
      type: string
      description: "ISO 4217 currency code"
    - name: geofence_wkt
      type: string
      description: "City geofence as WKT polygon"
    - name: launched_at
      type: string
      description: "Date the city launched on the platform"
    - name: sunset_at
      type: string
      description: "Date the city was retired (nullable)"
    - name: _lakelogic_processed_at
      type: timestamp

source:
  type: landing
  path: "{landing_root}/city_master"
  format: csv
  options:
    header: "true"
  load_mode: full     # full reload each time — small static file
  watermark_strategy: none
