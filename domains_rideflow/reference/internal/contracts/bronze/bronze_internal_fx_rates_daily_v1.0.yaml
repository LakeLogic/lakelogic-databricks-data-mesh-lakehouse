version: 1.0.0

info:
  title: "Bronze — Internal FX Rates Daily"
  table_name: "{bronze_layer}_{system}_fx_rates_daily"
  description: >
    Daily foreign-exchange rates pulled from the ECB reference rates API.
    Used downstream by fact_revenue_daily to normalize multi-currency
    transactions to USD. One row per (currency × date).
  target_layer: bronze
  domain: reference
  system: internal

model:
  fields:
    - name: rate_date
      type: string
      required: true
      description: "ISO date (YYYY-MM-DD)"
    - name: base_currency
      type: string
      required: true
      description: "Base currency (typically EUR for ECB feed)"
    - name: quote_currency
      type: string
      required: true
      description: "ISO 4217 quote currency code"
    - name: rate
      type: float
      required: true
      description: "Mid-market rate, base per quote"
    - name: source_feed
      type: string
      description: "Provider identifier (e.g. ecbreference)"
    - name: _lakelogic_processed_at
      type: timestamp

source:
  type: landing
  path: "{landing_root}/fx_rates_daily"
  format: csv
  options:
    header: "true"
    recursiveFileLookup: "true"
  load_mode: incremental
  # No `partition:` block — the generator writes a single flat seed file
  # (fx_rates_daily/fx_rates_daily_seed.csv), not date-partitioned folders. A
  # partition format here would make a full-load scan look in non-existent
  # y/m/d dirs and find nothing. recursiveFileLookup (above) discovers the file.
