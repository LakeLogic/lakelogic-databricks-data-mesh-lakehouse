version: 1.0.0

info:
  title: "Gold — Dim City (SCD2)"
  table_name: "{gold_layer}_internal_dim_city"
  description: >
    Slowly Changing Dimension (Type 2) for operating cities. Tracks history
    when geofence or active status changes. Every fact that references
    city_code keys via (city_code, effective_from .. effective_to).
  target_layer: gold
  domain: reference
  system: internal

model:
  fields:
    - name: city_sk
      type: long
      required: true
      description: "Surrogate key; new for each SCD2 version"
    - name: city_code
      type: string
      required: true
      description: "Business key (stable across versions)"
    - name: city_name
      type: string
    - name: country_code
      type: string
      description: "ISO alpha-3 country code (carried through from silver)"
    - name: timezone
      type: string
    - name: default_currency
      type: string
    - name: geofence_wkt
      type: string
    - name: is_active
      type: boolean
    - name: effective_from
      type: timestamp
      required: true
      description: "When this version became current"
    - name: effective_to
      type: timestamp
      description: "Closed when superseded; NULL for current version"
    - name: is_current
      type: boolean
      required: true

quality:
  row_rules: []
  dataset_rules:
    - unique: city_sk

# SCD2 matches existing↔incoming on the BUSINESS key (city_code), NOT the
# surrogate city_sk (generated per version by the materializer).
primary_key: [city_code]

source:
  type: table
  path: "table:{domain_catalog}.silver_internal_cities"
  load_mode: full

# Project silver to the dimension's attributes and rename country_code ->
# country_alpha3. Cities have no source change-timestamp, so effective_from
# falls back to the origin sentinel for new versions (acceptable for this
# rarely-changing reference dim). The SCD2 mechanics columns (city_sk,
# effective_from/to, is_current) are injected by the materializer below.
transformations:
  - phase: pre
    sql: >
      SELECT
        city_code,
        city_name,
        country_code,
        timezone,
        default_currency,
        geofence_wkt,
        is_active
      FROM source

# Native LakeLogic SCD2. NOTE: the old top-level `scd:` block was NOT read by
# the engine (it logged "Unknown key 'scd'") — SCD2 config MUST live here under
# materialization.scd2.
materialization:
  strategy: scd2
  format: delta
  scd2:
    surrogate_key: city_sk
    surrogate_key_strategy: hash
    effective_from_field: effective_from
    effective_to_field: effective_to
    current_flag_field: is_current
    track_columns:
      - geofence_wkt
      - timezone
      - default_currency
      - is_active
    unknown_member:
      enabled: true
      surrogate_key_value: "-1"
