version: 1.0.0

info:
  data_product: reference_data
  data_product_output: dim_payment_method
  title: "Gold — Dim Payment Method"
  table_name: "{gold_layer}_dim_payment_method"
  description: >
    Payment-method dimension (card, apple_pay, google_pay, cash, wallet)
    with PCI/cashflow flags. Joined by stripe charges and reconciliation
    facts.
  target_layer: gold
  domain: reference
  system: internal

model:
  fields:
    - name: payment_method_code
      type: string
      required: true
      description: "Internal stable code (e.g. CARD, APPLE_PAY)"
    - name: payment_method_name
      type: string
    - name: rail
      type: string
      description: "Settlement rail (card, wallet, cash, bank)"
    - name: requires_strong_auth
      type: boolean
      description: "PSD2 strong customer authentication required"
    - name: settles_instantly
      type: boolean

quality:
  row_rules: []
  dataset_rules:
    - unique: payment_method_code

primary_key: [payment_method_code]

source:
  type: landing
  path: "{landing_root}/dim_payment_method_seed"
  format: csv
  options:
    header: "true"
  load_mode: incremental
  watermark_strategy: pipeline_log

# Incremental source → upsert on primary_key (SCD1) so a re-read or
# updated row replaces its previous version instead of duplicating.
materialization:
  strategy: merge
