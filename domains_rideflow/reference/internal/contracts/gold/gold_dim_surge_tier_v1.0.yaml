version: 1.0.0

info:
  title: "Gold — Dim Surge Tier"
  table_name: "{gold_layer}_internal_dim_surge_tier"
  description: >
    Surge pricing tier brackets (1.0x, 1.3x, 1.7x, 2.5x, 4.0x) with display
    labels. Joined by trip facts and surge_pricing_inference for analysis.
  target_layer: gold
  domain: reference
  system: internal

model:
  fields:
    - name: surge_tier_code
      type: string
      required: true
      description: "Internal code (e.g. TIER_1, TIER_2, ...)"
    - name: multiplier_min
      type: float
      description: "Inclusive lower bound of the surge multiplier"
    - name: multiplier_max
      type: float
      description: "Exclusive upper bound"
    - name: display_label
      type: string
      description: "User-facing label (e.g. 'Surge 1.3x')"
    - name: notify_rider
      type: boolean
      description: "Whether riders are warned before booking"

quality:
  row_rules: []
  dataset_rules:
    - unique: surge_tier_code

primary_key: [surge_tier_code]

source:
  type: landing
  path: "{landing_root}/dim_surge_tier_seed"
  format: csv
  options:
    header: "true"
  load_mode: full
  watermark_strategy: none
