version: 1.0.0

info:
  title: Bronze — Meta Ads Campaigns
  target_layer: bronze
  table_name: '{bronze_layer}_meta_ads_campaigns'
  domain: marketing
  system: meta_ads

model:
  fields:
  - name: campaign_id
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_marketing.meta_ads_campaigns.
  - name: campaign_name
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_marketing.meta_ads_campaigns.
  - name: adset_id
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_marketing.meta_ads_campaigns.
  - name: adset_name
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_marketing.meta_ads_campaigns.
  - name: date
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_marketing.meta_ads_campaigns.
  - name: impressions
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_marketing.meta_ads_campaigns.
  - name: clicks
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_marketing.meta_ads_campaigns.
  - name: spend
    type: Float64
    description: Observed Float64 column ingested from the scanned source salakelogicdemolanding
      - landing.landing_marketing.meta_ads_campaigns.
  - name: actions_json
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_marketing.meta_ads_campaigns.
  - name: conversions
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_marketing.meta_ads_campaigns.
  - name: currency
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_marketing.meta_ads_campaigns.

source:
  type: landing
  path: '{landing_root}/campaigns'
  format: csv
  partition:
    format: y_%Y/m_%m/d_%d/h_%H
  load_mode: incremental
  watermark_strategy: pipeline_log

primary_key:
- campaign_id

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'

dataset: bronze_meta_ads_campaigns
