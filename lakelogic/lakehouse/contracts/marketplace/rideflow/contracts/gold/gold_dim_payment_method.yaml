version: 1.0.0

info:
  title: Gold — Dim Payment Method
  target_layer: gold
  description: 'grain: one row per payment_method'
  table_name: '{gold_layer}_dim_payment_method'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: payment_method_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: payment_method
    type: string
    required: true
    description: Dimension attribute 'payment_method', projected from the 'payment_method'
      entity.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_payment_method

primary_key:
- payment_method

quality:
  dataset_rules:
  - unique:
      columns:
      - payment_method
      name: payment_method_unique
      category: uniqueness
      description: No two rows share the same payment_method.

materialization:
  scd1:
    surrogate_key: payment_method_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT payment_method
    FROM source
    WHERE payment_method IS NOT NULL
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_trip_completed
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
