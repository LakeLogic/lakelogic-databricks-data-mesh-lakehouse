version: 1.0.0

info:
  title: Gold — Dim Screen Name
  target_layer: gold
  description: 'grain: one row per screen_name'
  table_name: '{gold_layer}_dim_screen_name'
  system: rideflow
  domain: marketplace

model:
  fields:
  - name: screen_name_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: screen_name
    type: string
    required: true
    description: Dimension attribute 'screen_name', projected from the 'screen_name'
      entity.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_screen_name

primary_key:
- screen_name

quality:
  dataset_rules:
  - unique:
      columns:
      - screen_name
      name: screen_name_unique
      category: uniqueness
      description: No two rows share the same screen_name.

materialization:
  scd1:
    surrogate_key: screen_name_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT screen_name
    FROM source
    WHERE screen_name IS NOT NULL
- phase: pre
  derive:
    field: system
    sql: '''rideflow'''

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_rideflow_rider_app_events
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
