    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_operations.zendesk_support_tickets.
  - name: created_at
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_operations.zendesk_support_tickets.
  - name: updated_at
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_operations.zendesk_support_tickets.
  - name: solved_at
