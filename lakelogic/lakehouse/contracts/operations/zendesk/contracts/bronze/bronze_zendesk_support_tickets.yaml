version: 1.0.0

info:
  title: Bronze — Zendesk Support Tickets
  target_layer: bronze
  table_name: '{bronze_layer}_zendesk_support_tickets'
  domain: operations
  system: zendesk

model:
  fields:
  - name: ticket_id
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_operations.zendesk_support_tickets.
  - name: entry_point
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
