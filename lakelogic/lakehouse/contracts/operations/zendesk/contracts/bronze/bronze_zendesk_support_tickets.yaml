      - landing.landing_operations.zendesk_support_tickets.

source:
  type: landing
  path: '{landing_root}/support_tickets'
  format: csv
  partition:
    format: y_%Y/m_%m/d_%d/h_%H
  load_mode: incremental
  watermark_strategy: pipeline_log

primary_key:
- ticket_id

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'

dataset: bronze_zendesk_support_tickets
