      - landing.landing_operations.zendesk_support_tickets. Personal data (phone),
      not masked.
  - name: subject
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_operations.zendesk_support_tickets.
  - name: ticket_description
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_operations.zendesk_support_tickets.
  - name: status
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_operations.zendesk_support_tickets.
  - name: priority
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_operations.zendesk_support_tickets.
  - name: channel
    type: string
    description: Observed string column ingested from the scanned source salakelogicdemolanding
      - landing.landing_operations.zendesk_support_tickets.
