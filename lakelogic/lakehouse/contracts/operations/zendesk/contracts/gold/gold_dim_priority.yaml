version: 1.0.0

info:
  title: Gold — Dim Priority
  target_layer: gold
  description: 'grain: one row per priority'
  table_name: '{gold_layer}_dim_priority'
  system: zendesk
  domain: operations

model:
  fields:
  - name: priority_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: priority
    type: string
    required: true
    description: Dimension attribute 'priority', projected from the 'priority' entity.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_priority

primary_key:
- priority

quality:
  dataset_rules:
  - unique:
      columns:
      - priority
      name: priority_unique
      category: uniqueness
      description: No two rows share the same priority.

materialization:
  scd1:
    surrogate_key: priority_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT priority
    FROM source
    WHERE priority IS NOT NULL
- phase: pre
  derive:
    field: system
    sql: '''zendesk'''

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_zendesk_support_tickets
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
