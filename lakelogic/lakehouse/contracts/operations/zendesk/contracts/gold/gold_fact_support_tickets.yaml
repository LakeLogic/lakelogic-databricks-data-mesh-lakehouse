version: 1.0.0

info:
  title: Gold — Fact Support Tickets
  target_layer: gold
  description: 'grain: one row per support ticket, updated as it moves through its
    lifecycle'
  table_name: '{gold_layer}_fact_support_tickets'
  system: zendesk
  domain: operations

model:
  fields:
  - name: ticket_id
    type: string
    required: true
    description: Grain key of the 'support_tickets' fact.
  - name: satisfaction_rating
    type: float
    required: false
    description: 'Measure candidate: avg of ''satisfaction_rating'' (needs confirmation).'
  - name: created_at
    type: timestamp
    required: false
    description: Column 'created_at' of the 'support_tickets' fact.
  - name: solved_at
    type: timestamp
    required: false
    description: Column 'solved_at' of the 'support_tickets' fact.
  - name: trip_id
    type: string
    required: false
    description: Column 'trip_id' of the 'support_tickets' fact.
  - name: charge_id
    type: string
    required: false
    description: Column 'charge_id' of the 'support_tickets' fact.
  - name: requester_name
    type: string
    required: false
    description: Column 'requester_name' of the 'support_tickets' fact.
  - name: subject
    type: string
    required: false
    description: Column 'subject' of the 'support_tickets' fact.
  - name: ticket_description
    type: string
    required: false
    description: Column 'ticket_description' of the 'support_tickets' fact.
  - name: assignee
    type: string
    required: false
    description: Column 'assignee' of the 'support_tickets' fact.
  - name: tags_json
    type: string
    required: false
    description: Column 'tags_json' of the 'support_tickets' fact.
  - name: updated_at
    type: timestamp
    required: false
    description: Column 'updated_at' of the 'support_tickets' fact.
  - name: ticket_sentiment
    type: string
    required: true
    description: 'Derived from subject by rule: one of billing, service_delay, safety,
      lost_item, other, neutral.'
  - name: driver_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_driver_profiles
      column: driver_profiles_sk
    description: Surrogate key of gold_dim_driver_profiles, looked up as of created_at;
      '-1' when the dimension does not know the row.
  - name: rider_sk
    type: string
    required: true
    foreign_key:
      contract: gold_dim_rider_profiles
      column: rider_profiles_sk
    description: Surrogate key of gold_dim_rider_profiles, looked up as of created_at;
      '-1' when the dimension does not know the row.
  - name: created_date
    type: date
    required: false
    description: 'Partition column: the calendar date of `created_at`.'
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_fact_support_tickets

primary_key:
- ticket_id

quality:
  row_rules:
  - name: ticket_sentiment_accepted_values
    sql: ticket_sentiment IN ('billing', 'service_delay', 'safety', 'lost_item', 'other',
      'neutral')
    category: validity
    description: 'ticket_sentiment is one of: billing, service_delay, safety, lost_item,
      other, neutral.'
  dataset_rules:
  - unique:
      columns:
      - ticket_id
      name: ticket_id_unique
      category: uniqueness
      description: No two rows share the same ticket_id.
  - name: driver_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE driver_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose driver_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.
  - name: rider_sk_unknown_member_rows
    sql: SELECT COUNT(*) FROM {dataset} WHERE rider_sk = '-1'
    must_be_less_than: 1
    severity: warning
    category: consistency
    description: Rows whose rider_sk fell back to the unknown member — the dimension
      did not know them when this fact ran.

transformations:
- phase: pre
  sql: |-
    SELECT
      r.ticket_id,
      r.created_at,
      r.solved_at,
      r.trip_id,
      r.charge_id,
      r.requester_name,
      r.subject,
      r.ticket_description,
      r.assignee,
      r.tags_json,
      r.updated_at,
      CASE WHEN (LOWER(r.subject) LIKE '%refund%' OR LOWER(r.subject) LIKE '%charge%' OR LOWER(r.subject) LIKE '%overcharged%' OR LOWER(r.subject) LIKE '%double%') THEN 'billing' WHEN (LOWER(r.subject) LIKE '%late%' OR LOWER(r.subject) LIKE '%delay%' OR LOWER(r.subject) LIKE '%wait%' OR LOWER(r.subject) LIKE '%no-show%' OR LOWER(r.subject) LIKE '%never arrived%') THEN 'service_delay' WHEN (LOWER(r.subject) LIKE '%unsafe%' OR LOWER(r.subject) LIKE '%rude%' OR LOWER(r.subject) LIKE '%harass%' OR LOWER(r.subject) LIKE '%dangerous%') THEN 'safety' WHEN (LOWER(r.subject) LIKE '%lost%' OR LOWER(r.subject) LIKE '%left behind%' OR LOWER(r.subject) LIKE '%missing item%') THEN 'lost_item' WHEN r.subject IS NOT NULL THEN 'other' ELSE 'neutral' END AS ticket_sentiment,
      r.satisfaction_rating AS satisfaction_rating,
      COALESCE(d1.driver_profiles_sk, '-1') AS driver_sk,
      COALESCE(d2.rider_profiles_sk, '-1') AS rider_sk,
      CAST(r.created_at AS DATE) AS created_date
    FROM source r
    LEFT JOIN gold_dim_driver_profiles d1
      ON  r.driver_id = d1.driver_id
      AND r.created_at >= d1.effective_from
      AND r.created_at < COALESCE(d1.effective_to, CAST('9999-12-31 00:00:00' AS TIMESTAMP))
    LEFT JOIN gold_dim_rider_profiles d2
      ON  r.rider_id = d2.rider_id
      AND r.created_at >= d2.effective_from
      AND r.created_at < COALESCE(d2.effective_to, CAST('9999-12-31 00:00:00' AS TIMESTAMP))
- phase: pre
  derive:
    field: system
    sql: '''zendesk'''

links:
- name: gold_dim_driver_profiles
  type: table
  path: table:{domain_catalog__marketplace}.{gold_layer}_dim_driver_profiles
- name: gold_dim_rider_profiles
  type: table
  path: table:{domain_catalog__marketplace}.{gold_layer}_dim_rider_profiles

upstream:
- gold_dim_driver_profiles
- gold_dim_rider_profiles

materialization:
  fact:
    type: accumulating_snapshot
    milestone_dates:
    - created_at
    - solved_at
  partition_by:
  - created_date

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_zendesk_support_tickets
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
