version: 1.0.0

info:
  title: Gold — Dim Refund Reason
  target_layer: gold
  description: 'grain: one row per refund_reason'
  table_name: '{gold_layer}_dim_refund_reason'
  system: stripe
  domain: payments

model:
  fields:
  - name: refund_reason_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: refund_reason
    type: string
    required: true
    description: Dimension attribute 'refund_reason', projected from the 'refund_reason'
      entity.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_refund_reason

primary_key:
- refund_reason

quality:
  dataset_rules:
  - unique:
      columns:
      - refund_reason
      name: refund_reason_unique
      category: uniqueness
      description: No two rows share the same refund_reason.

materialization:
  scd1:
    surrogate_key: refund_reason_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

transformations:
- phase: pre
  sql: |-
    SELECT DISTINCT refund_reason
    FROM source
    WHERE refund_reason IS NOT NULL
- phase: pre
  derive:
    field: system
    sql: '''stripe'''

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_stripe_refunds
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'
