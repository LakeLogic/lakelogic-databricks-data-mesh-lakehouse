version: 1.0.0

info:
  title: Gold — Dim Dim Currency Seed
  target_layer: gold
  description: 'grain: one row per currency'
  table_name: '{gold_layer}_dim_dim_currency_seed'
  system: internal
  domain: reference

model:
  fields:
  - name: dim_currency_seed_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: currency_code
    type: string
    required: true
    description: Dimension attribute 'currency_code', projected from the 'dim_currency_seed'
      entity.
  - name: currency_numeric
    type: Int64
    required: false
    description: Dimension attribute 'currency_numeric', projected from the 'dim_currency_seed'
      entity.
  - name: currency_name
    type: string
    required: false
    description: Dimension attribute 'currency_name', projected from the 'dim_currency_seed'
      entity.
  - name: symbol
    type: string
    required: false
    description: Dimension attribute 'symbol', projected from the 'dim_currency_seed'
      entity.
  - name: minor_units
    type: Int64
    required: false
    description: Dimension attribute 'minor_units', projected from the 'dim_currency_seed'
      entity.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_dim_currency_seed

primary_key:
- currency_code

materialization:
  scd1:
    surrogate_key: dim_currency_seed_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_internal_dim_currency_seed
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'

transformations:
- phase: pre
  derive:
    field: system
    sql: '''internal'''
