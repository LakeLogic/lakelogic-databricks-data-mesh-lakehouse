version: 1.0.0

info:
  title: Gold — Dim Dim Vehicle Type Seed
  target_layer: gold
  description: 'grain: one row per vehicle type code'
  table_name: '{gold_layer}_dim_dim_vehicle_type_seed'
  system: internal
  domain: reference

model:
  fields:
  - name: dim_vehicle_type_seed_sk
    type: string
    required: false
    description: 'Surrogate key: sha256 of the business key, written by the materializer;
      ''-1'' is the unknown member.'
  - name: vehicle_type_code
    type: string
    required: true
    description: Dimension attribute 'vehicle_type_code', projected from the 'dim_vehicle_type_seed'
      entity.
  - name: vehicle_type_name
    type: string
    required: false
    description: Dimension attribute 'vehicle_type_name', projected from the 'dim_vehicle_type_seed'
      entity.
  - name: passenger_capacity
    type: Int64
    required: false
    description: Dimension attribute 'passenger_capacity', projected from the 'dim_vehicle_type_seed'
      entity.
  - name: product_tier
    type: string
    required: false
    description: Dimension attribute 'product_tier', projected from the 'dim_vehicle_type_seed'
      entity.
  - name: requires_inspection
    type: boolean
    required: false
    description: Dimension attribute 'requires_inspection', projected from the 'dim_vehicle_type_seed'
      entity.
  - name: system
    type: string
    required: true
    description: Source system this row came from

dataset: gold_dim_dim_vehicle_type_seed

primary_key:
- vehicle_type_code

materialization:
  scd1:
    surrogate_key: dim_vehicle_type_seed_sk
    surrogate_key_strategy: hash
    unknown_member:
      enabled: true
      surrogate_key_value: '-1'

source:
  type: table
  path: table:{domain_catalog}.{silver_layer}_internal_dim_vehicle_type_seed
  load_mode: incremental
  watermark_field: _lakelogic_processed_at

metadata:
  run_log_table: '{domain_catalog}._lakelogic_run_log'

transformations:
- phase: pre
  derive:
    field: system
    sql: '''internal'''
