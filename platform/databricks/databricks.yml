# ══════════════════════════════════════════════════════════════════════════════
# LakeLogic — RideFlow Marketplace DAB Bundle
# ══════════════════════════════════════════════════════════════════════════════
bundle:
  name: lakelogic-rideflow

include:
  - resources/**/*.yml
  - databrick_variables.yml

sync:
  paths:
    - .
    - ../../contracts

workspace:
  root_path: /Workspace/Shared/data_platform/domains/${var.domain}/${var.system}

targets:
  dev:
    mode: production #development
    default: true
    workspace:
      # Azure workspace (2026-10-02); the AWS dev deployment was destroyed.
      host: https://adb-7405615991211788.8.azuredatabricks.net
      root_path: /Workspace/Shared/${var.deployment_folder}
    variables:
      catalog: "rideflow_dev_platform"
      # The engine comes from PyPI, pinned: Databricks pre-installs an older lakelogic, and a
      # blank version can leave that one in place. 1.76.0 is the first release that writes each
      # layer to its own schema (storage.bronze_root / silver_root / gold_root). An older engine
      # ignores those keys and writes every table to the `lakelogic` schema.
      lakelogic_wheel: ""
      lakelogic_version: "1.76.0"
      # Blank = the catalog was created in the UI on the metastore's storage.
      catalog_storage_root: ""

  stage:
    variables:
      catalog: "rideflow_stg_platform"
      environment: "stage"

  prod:
    mode: production
    variables:
      catalog: "rideflow_prod_platform"
      environment: "prod"
    permissions:
      - group_name: "data-team"
        level: CAN_VIEW
